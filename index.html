<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Драконье гнездо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --night:#1b1740; --panel:#2a2560; --panel2:#352f75; --ink:#f2efff; --mute:#a9a3d6;
  --ember:#ff8a3d; --ember2:#ff6a3d; --gold:#ffcf4a; --mint:#6fe3c1; --danger:#ff6b81;
  --r0:#9fb0c3; --r1:#4aa8ff; --r2:#b872ff; --r3:#ffb52e; --r4:#ff5fb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1740}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{
  max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,#0000 52%),
    radial-gradient(1px 1px at 78% 10%,#fff8 50%,#0000 52%),
    radial-gradient(1.5px 1.5px at 60% 34%,#fffa 50%,#0000 52%),
    radial-gradient(1px 1px at 30% 46%,#fff7 50%,#0000 52%),
    radial-gradient(1px 1px at 90% 52%,#fff7 50%,#0000 52%),
    radial-gradient(1.5px 1.5px at 44% 8%,#fff8 50%,#0000 52%),
    linear-gradient(180deg,#2c2670 0%,#1b1740 55%,#14203f 100%);
}
#top{display:flex;gap:8px;padding:12px 14px 6px;align-items:center;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.09);font-weight:700;font-size:14px;white-space:nowrap}
.chip.gold{background:rgba(255,207,74,.16);color:var(--gold);font-size:16px;flex:1}
.chip.dim{opacity:.55}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(14,11,40,.86);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{position:relative;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
#tabs button .ic{font-size:22px;filter:grayscale(.6);transition:transform .15s}
#tabs button.on{color:var(--gold)}
#tabs button.on .ic{filter:none;transform:translateY(-2px) scale(1.12)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid #1b1740;display:none}
.dot.show{display:block}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.07);width:max-content;margin:4px auto 0}
.seg button{padding:7px 18px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--ink)}

.scene{position:relative;height:310px;display:flex;align-items:flex-end;justify-content:center;margin-top:2px}
.glow{position:absolute;bottom:26px;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 66%);opacity:.3}
.nest{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:310px;height:84px;pointer-events:none}
.creature{position:relative;z-index:1;width:250px;height:250px;margin-bottom:38px;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:idle 3.4s ease-in-out infinite;transform-origin:50% 90%}
.creature.egg{width:196px;height:236px;margin-bottom:34px}
.creature svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.creature.squish{animation:squish .2s ease-out}
.creature.wob{animation:wob .28s ease-out}
.creature.happy{animation:happy .6s ease-out}
.myth{animation:hue 6s linear infinite}
.tw{animation:tw 2.2s ease-in-out infinite}
.pop{position:absolute;z-index:5;font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #5a3a00,0 0 10px rgba(255,207,74,.6);pointer-events:none;animation:rise .85s ease-out forwards}

.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:14px 16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dname{font-size:22px;font-weight:800;line-height:1.15}
.sub{font-size:13px;color:var(--mute);line-height:1.35;margin-top:2px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;color:#1b1030;background:var(--rc,var(--r0));white-space:nowrap}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 6px}
.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#b8ff9f);transition:width .25s}
.bar.ember b{background:linear-gradient(90deg,var(--ember),var(--gold))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:rgba(0,0,0,.18);border-radius:14px;padding:9px 12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:17px;color:var(--gold)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:13px 14px;border-radius:16px;font-weight:800;font-size:15px;text-align:center;background:var(--panel2);color:var(--ink);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--ember),var(--ember2));color:#2b1300;box-shadow:0 4px 0 #a8431d}
.btn.primary:active{box-shadow:0 1px 0 #a8431d;transform:translateY(3px)}
.btn.mint{background:var(--mint);color:#06332a}
.btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.2)}
.btn.full{grid-column:1/-1;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.8;margin-top:1px}
.eggcap{text-align:center;margin-top:10px}
.eggcap .ename{font-size:20px;font-weight:800}
.eggcap .bar{max-width:280px;margin:10px auto 6px}
h3{font-size:18px;font-weight:800;margin:16px 2px 0}
.hint{font-size:13px;color:var(--mute);margin:6px 2px 0;line-height:1.4}

.shop{display:grid;gap:10px;margin-top:10px}
.shopitem{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(0,0,0,.2);border-radius:16px;padding:10px 12px;width:100%}
.shopitem .mini{width:52px;height:62px;flex:none}
.shopitem .mini svg{width:100%;height:100%}
.shopitem b{display:block;font-size:16px}
.shopitem span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.shopitem .cost{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dcard{position:relative;border-radius:20px;padding:8px 8px 12px;text-align:center;background:rgba(255,255,255,.06);border:2px solid var(--rc);box-shadow:0 0 18px -6px var(--rc),inset 0 0 24px -14px var(--rc)}
.dcard .art{width:100%;aspect-ratio:1/1}
.dcard .art svg{width:100%;height:100%;display:block}
.dcard b{display:block;font-size:15px}
.dcard span{font-size:12px;color:var(--mute)}
.dcard .star{position:absolute;top:8px;left:10px;font-size:16px}
.dcard .pill{position:absolute;top:8px;right:8px;font-size:11px;padding:3px 8px}
.album{display:grid;gap:8px;margin-top:10px}
.arow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:16px;padding:8px 12px}
.arow .el{font-size:22px;width:30px;text-align:center}
.arow .bn{flex:1;font-weight:700;font-size:14px}
.swatch{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.35);background:var(--sw)}
.swatch.no{background:rgba(255,255,255,.08);border-style:dashed;color:var(--mute)}

.q{display:flex;flex-direction:column;gap:6px}
.q .qt{font-weight:700;font-size:15px}
.q .qr{font-weight:800;color:var(--gold);white-space:nowrap}
.q .bar{margin:4px 0 0}
.q.done{opacity:.55}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border-radius:12px;padding:8px 0 6px;text-align:center;background:rgba(0,0,0,.2);font-size:11px;color:var(--mute);border:2px solid transparent}
.day i{display:block;font-style:normal;font-size:20px;margin:2px 0}
.day b{display:block;font-size:12px;color:var(--ink)}
.day.got{background:rgba(111,227,193,.16);border-color:rgba(111,227,193,.4)}
.day.now{background:rgba(255,207,74,.18);border-color:var(--gold);animation:glowpulse 1.8s ease-in-out infinite}
.ach .at{font-weight:800;font-size:15px}
.ach .ad{font-size:13px;color:var(--mute)}
.ach.got{opacity:.5}

.exp .party{display:flex;gap:6px;margin:10px 0 2px}
.exp .av{width:56px;height:56px;border-radius:14px;background:rgba(0,0,0,.22);padding:2px}
.exp .av svg{width:100%;height:100%;display:block}
.locrow{display:flex;gap:12px;align-items:center}
.lic{font-size:30px;width:44px;text-align:center;flex:none}
.pick{grid-template-columns:repeat(3,1fr);gap:8px}
.pick .dcard{padding:4px 4px 8px}
.pick .dcard b{font-size:13px}
.pick .pill{display:none}
.dcard.on{background:rgba(111,227,193,.22);outline:3px solid var(--mint)}
.sum{text-align:left;background:rgba(0,0,0,.22);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14px;line-height:1.55}
.sum b{color:var(--gold)}
.creature.egg.ready{animation:shake 1.5s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.78);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.sheet{position:relative;width:100%;max-width:380px;max-height:92vh;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#352f75,#2a2560);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:20px 18px 18px;text-align:center;animation:sheet .28s cubic-bezier(.2,1.3,.4,1)}
.sheet h2{font-size:24px;font-weight:800;margin-top:4px}
.sheet p{color:var(--mute);font-size:14px;line-height:1.4;margin-top:6px}
.sheet .big{width:230px;height:230px;margin:6px auto 0}
.sheet .big svg{width:100%;height:100%;display:block;overflow:visible}
.sheet .btn{width:100%;margin-top:14px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet .two .btn{margin-top:8px}
.banner{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;font-size:14px;color:#1b1030;background:var(--rc);box-shadow:0 0 24px var(--rc)}
.newlook{color:var(--mint)!important;font-weight:800}
.burst{position:absolute;left:50%;top:150px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;background:#efe6ff;clip-path:polygon(50% 0,100% 100%,0 80%);animation:fly .95s ease-out forwards}
.burst i:nth-child(3n){background:var(--rc)}
.burst i:nth-child(3n+1){background:#ffd98a}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0e0b28;color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;border:1px solid rgba(255,255,255,.15);max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.012,.99)}}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.09,.9)}100%{transform:scale(1)}}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes happy{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}80%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-80px) scale(1.15)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:scale(.85) translateY(20px);opacity:0}}
@keyframes fly{from{transform:translate(0,0) rotate(0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
@keyframes glowpulse{50%{box-shadow:0 0 16px rgba(255,207,74,.5)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="screen"></main>
  <nav id="tabs"></nav>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============================================================
   НАСТРОЙКА: впиши сюда username своего бота (без @) и,
   если нужно, короткое имя Mini App из @BotFather (/newapp).
   Нужно для кнопки «Пригласить друга».
   ============================================================ */
var CONFIG = { BOT_USERNAME: '', APP_SHORT_NAME: '' };

(function () {
'use strict';

/* ---------- Telegram ---------- */
var tg = window.Telegram && window.Telegram.WebApp;
try {
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#1b1740'); tg.setBackgroundColor('#1b1740'); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
} catch (e) {}
function haptic(kind) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(kind || 'light');
  } catch (e) {}
}

/* ---------- Данные игры ---------- */
var RARITY = [
  { name: 'Обычный',     color: '#9fb0c3', mult: 1 },
  { name: 'Редкий',      color: '#4aa8ff', mult: 1.6 },
  { name: 'Эпический',   color: '#b872ff', mult: 2.8 },
  { name: 'Легендарный', color: '#ffb52e', mult: 5 },
  { name: 'Мифический',  color: '#ff5fb0', mult: 10 }
];
var EGGS = {
  basic:   { name: 'Обычное яйцо', base: 200,  step: 40,  time: 20 * 60e3, odds: [62, 25, 9.5, 3, 0.5],  tint: 0 },
  premium: { name: 'Редкое яйцо',  base: 2000, step: 300, time: 60 * 60e3, odds: [20, 45, 25, 8.5, 1.5], tint: 1 }
};
// [название окраса, тело, брюшко, крылья, глаза]
var BREEDS = [
  { name: 'Огненный', el: '🔥', v: [
    ['Алый',      '#e5483d', '#ffd9a0', '#a82a30', '#ffe14d'],
    ['Янтарный',  '#f0932b', '#ffe7b0', '#c0601a', '#fff07a'],
    ['Магма',     '#3b2a33', '#ff9a3d', '#7a1e1e', '#ff6a2a'] ] },
  { name: 'Водный', el: '💧', v: [
    ['Лазурный',   '#3d9be9', '#d4f0ff', '#2468b5', '#fff3a0'],
    ['Бирюзовый',  '#26c6b5', '#d9fff6', '#168a86', '#fff7b0'],
    ['Глубинный',  '#27449c', '#8fc1ff', '#16286b', '#7ff3ff'] ] },
  { name: 'Лесной', el: '🌿', v: [
    ['Изумрудный', '#3fbf6a', '#e6ffd3', '#23834a', '#ffe66d'],
    ['Мшистый',    '#7d9b3f', '#f1f3c4', '#586f25', '#ffd36b'],
    ['Осенний',    '#c9862b', '#fff0c2', '#8d4f1c', '#8aff9a'] ] },
  { name: 'Грозовой', el: '⚡', v: [
    ['Серебряный', '#aab6c8', '#f2f6fc', '#6d7a92', '#8fe3ff'],
    ['Фиолетовый', '#7a5ce0', '#e1d6ff', '#4a37a0', '#fff27a'],
    ['Индиго',     '#33407a', '#9aa8ee', '#1f2650', '#ffe45e'] ] },
  { name: 'Теневой', el: '🌙', v: [
    ['Ночной',      '#2f2a4a', '#6c5f9e', '#1a1630', '#ff5c8a'],
    ['Пепельный',   '#6b6b78', '#c9c9d6', '#3f3f4a', '#ff9d5c'],
    ['Сумеречный',  '#5b2f6e', '#d39be6', '#35183f', '#7fffd4'] ] },
  { name: 'Кристальный', el: '💎', v: [
    ['Розовый кварц', '#f48fb8', '#ffe3ef', '#c4608a', '#fff3a0'],
    ['Аметист',       '#a35fd9', '#efd9ff', '#6e34a0', '#9dffb0'],
    ['Ледяной',       '#9fe3f5', '#f1fcff', '#5db7d1', '#ff9ad1'] ] }
];
var NAMES = ['Искра','Пепел','Бриз','Мираж','Туча','Жемчуг','Клык','Рубин','Лучик','Вихрь','Дымка','Фрост','Мох','Гром','Тень','Звёздочка','Уголёк','Нефрит','Шторм','Сапфир','Янтарь','Ночка','Кристалл','Пламя','Комета','Ураган','Шишка','Заря'];
var STAGES = ['Малыш', 'Подросток', 'Взрослый', 'Легенда'];
var MAXL = 30;
var OFFLINE_CAP_H = 8;
var DAILY = [100, 150, 250, 400, 600, 900, 1500];
var QPOOL = [
  { k: 'exp',     t: 'Отправь отряд в экспедицию',    n: 1,   r: 120 },
  { k: 'expret',  t: 'Забери добычу из 2 экспедиций', n: 2,   r: 220 },
  { k: 'feed',    t: 'Покорми дракона 3 раза',        n: 3,   r: 150 },
  { k: 'spend',   t: 'Потрать 500 золота',            n: 500, r: 200 },
  { k: 'collect', t: 'Забери доход из гнезда',        n: 1,   r: 100 },
  { k: 'hatch',   t: 'Вылупи дракона из яйца',        n: 1,   r: 150 },
  { k: 'share',   t: 'Поделись игрой с другом',       n: 1,   r: 250 }
];
// Экспедиции: b = порода, которой место подходит лучше всего
var LOCS = [
  { name: 'Древний лес',        b: 2, ic: '🌿', min: 30,  rec: 25,  gold: 90,   xp: 25,  egg: [0.10, 0] },
  { name: 'Подводная пещера',   b: 1, ic: '💧', min: 60,  rec: 45,  gold: 200,  xp: 40,  egg: [0.12, 0] },
  { name: 'Вулкан',             b: 0, ic: '🔥', min: 120, rec: 80,  gold: 480,  xp: 70,  egg: [0.15, 0.02] },
  { name: 'Кристальная пещера', b: 5, ic: '💎', min: 180, rec: 120, gold: 850,  xp: 100, egg: [0.18, 0.04] },
  { name: 'Грозовые пики',      b: 3, ic: '⚡', min: 300, rec: 180, gold: 1600, xp: 150, egg: [0.22, 0.07] },
  { name: 'Руины теней',        b: 4, ic: '🌙', min: 480, rec: 260, gold: 3000, xp: 220, egg: [0.25, 0.12] }
];
var FLAVOR = ['нашёл в пещере старый сундук', 'спугнул стаю летучих мышей', 'выследил редкую добычу', 'переждал бурю и вернулся целым', 'нашёл горсть блестящих камней', 'подружился с местным зверьком'];
function breedsOwned(s) { var o = {}; s.dragons.forEach(function (d) { o[d.b] = 1; }); return Object.keys(o).length; }
function maxRarity(s) { var m = -1; s.dragons.forEach(function (d) { if (d.r > m) m = d.r; }); return m; }
function maxLvl(s) { var m = 0; s.dragons.forEach(function (d) { if (d.lvl > m) m = d.lvl; }); return m; }
function streakNow(s) { return s.login.streak; }

function crackStage(p) { return p > 0.8 ? 3 : p > 0.55 ? 2 : p > 0.25 ? 1 : 0; }
function hourly(d) { return Math.round(12 * (1 + (d.lvl - 1) * 0.3) * RARITY[d.r].mult); }
function totalHourly() { return state.dragons.reduce(function (a, d) { return a + hourly(d); }, 0); }
function pending() {
  var ms = Math.min(Math.max(0, Date.now() - state.lastCollect), OFFLINE_CAP_H * 3600e3);
  return ms / 3600e3 * totalHourly();
}
function feedCost(d) { return 25 + d.lvl * 5; }
function eggCost(t) { return EGGS[t].base + EGGS[t].step * state.dragons.length; }
function releaseValue(d) { return Math.round(60 * RARITY[d.r].mult * (1 + d.lvl * 0.2)); }
function track(k, n) {
  n = n || 1;
  state.quests.list.forEach(function (q) { if (q.k === k && !q.c) q.p = Math.min(q.n, q.p + n); });
}
function spend(n) { state.gold -= n; state.spent += n; track('spend', n); }
function refreshQuests() {
  var t = today();
  if (state.quests.date === t && state.quests.list.length) return false;
  var pool = QPOOL.filter(function (q) { return q.k !== 'exp' && (q.k !== 'share' || CONFIG.BOT_USERNAME); });
  state.quests = {
    date: t, bonus: false,
    list: [QPOOL[0]].concat(shuffle(pool).slice(0, 3)).map(function (q) { return { k: q.k, t: q.t, n: q.n, r: q.r, p: 0, c: false }; })
  };
  return true;
}
function loginInfo() {
  var L = state.login, t = today();
  if (L.last === t) return { claimed: true, day: ((L.streak - 1) % 7) + 1, streak: L.streak };
  var ns = (L.last && dayNum(t) - dayNum(L.last) === 1) ? L.streak + 1 : 1;
  return { claimed: false, day: ((ns - 1) % 7) + 1, streak: ns };
}
function streakShown() {
  var L = state.login; if (!L.last) return 0;
  var diff = dayNum(today()) - dayNum(L.last);
  return diff <= 1 ? L.streak : 0;
}
function achInfo(a) {
  var r = a.f(state), cur = Math.min(r[0], r[1]);
  return { cur: cur, tar: r[1], got: !!state.ach[a.id], can: !state.ach[a.id] && r[0] >= r[1] };
}
function badges() {
  var b = { home: false, exp: false, dragons: false, quests: false, rewards: false };
  if (!loginInfo().claimed) b.rewards = true;
  if (finishedCount() > 0) b.exp = true;
  if (state.egg && eggProg() >= 1) b.home = true;
  ACH.forEach(function (a) { if (achInfo(a).can) b.rewards = true; });
  state.quests.list.forEach(function (q) { if (q.p >= q.n && !q.c) b.quests = true; });
  if (state.quests.list.length && state.quests.list.every(function (q) { return q.c; }) && !state.quests.bonus) b.quests = true;
  return b;
}

function rollRarity(type) {
  var odds = EGGS[type].odds, x = Math.random() * 100, acc = 0;
  for (var i = 0; i < odds.length; i++) { acc += odds[i]; if (x < acc) return i; }
  return 0;
}
function newDragon(r) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), b: rnd(BREEDS.length), v: rnd(3), r: r, pat: rnd(3), horn: rnd(2), name: pick(NAMES), lvl: 1, xp: 0 };
}
function addXP(d, n) {
  var before = stageOf(d.lvl), lv = false;
  d.xp += n;
  while (d.lvl < MAXL && d.xp >= needXP(d.lvl)) { d.xp -= needXP(d.lvl); d.lvl++; lv = true; }
  if (d.lvl >= MAXL) d.xp = 0;
  return { leveled: lv, evolved: stageOf(d.lvl) > before };
}

function squish(el, cls) {
  cls = cls || 'squish';
  el.classList.remove('squish', 'wob', 'happy'); void el.offsetWidth; el.classList.add(cls);
  setTimeout(function () { el.classList.remove(cls); }, cls === 'happy' ? 620 : 300);
}
function pop(host, e, txt) {
  var r = host.getBoundingClientRect();
  var s = document.createElement('div'); s.className = 'pop'; s.textContent = txt;
  s.style.left = (e.clientX - r.left - 14 + (Math.random() * 30 - 15)) + 'px';
  s.style.top = (e.clientY - r.top - 30) + 'px';
  host.appendChild(s); setTimeout(function () { s.remove(); }, 900);
}
function tapDragon(e, el) {
  if (!active()) return;
  squish(el); pop(el.parentElement, e, '❤️'); haptic('light');
}

  var h = '<h2>Куда отправить?</h2><p>Подходящая порода даёт бонус к добыче.</p><div class="shop">';
  LOCS.forEach(function (L, i) {
    h += '<button class="shopitem" data-a="pickloc" data-v="' + i + '"><div class="lic">' + L.ic + '</div><div><b>' + L.name + '</b><span>' + durText(L.min) + ', сила от ' + L.rec + '. Бонус: ' + BREEDS[L.b].el + ' ' + plural(BREEDS[L.b].name) + '</span></div><div class="cost">~' + fmt(L.gold) + ' 🪙</div></button>';
  });
  openModal(h + '</div><button class="btn" data-a="close">Закрыть</button>');
}
function partyHTML() {
  var li = ui.send.loc, L = LOCS[li], sel = ui.send.sel.map(dragonById).filter(Boolean);
  var avail = state.dragons.filter(function (d) { return !isAway(d.id); }).sort(function (a, b) { return power(b) - power(a); });
  var rw = expReward(li, sel);
  var h = '<h2>' + L.ic + ' ' + L.name + '</h2><p>' + durText(L.min) + '. Выбери до 3 драконов. Звёздочка значит, что порода подходит месту.</p><div class="grid pick">';
  h += avail.map(function (d) {
    var on = ui.send.sel.indexOf(d.id) >= 0;
    return '<button class="dcard' + (on ? ' on' : '') + '" style="--rc:' + RARITY[d.r].color + '" data-a="pick" data-id="' + d.id + '"><div class="art">' + dragonSVG(d, stageOf(d.lvl)) + '</div><b>' + d.name + '</b><span>Сила ' + power(d) + (d.b === L.b ? ' ⭐' : '') + '</span></button>';
  }).join('') + '</div>';
  h += '<div class="sum">' + (sel.length
    ? 'Сила отряда: <b>' + rw.P + '</b> из рекомендуемых ' + L.rec + '<br>Добыча: <b>~' + fmt(rw.gold) + ' 🪙</b> и ' + rw.xp + ' опыта каждому' + (rw.bonus ? '<br>Бонус породы: +' + (rw.bonus * 25) + '%' : '')
    : 'Выбери хотя бы одного дракона') +
    '<br>Шанс билета на яйцо: ' + Math.round(L.egg[0] * 100) + '%' + (L.egg[1] ? ', на редкое ' + Math.round(L.egg[1] * 100) + '%' : '') + '</div>';
  h += '<div class="two"><button class="btn" data-a="sendnew">Назад</button><button class="btn primary" data-a="sendgo"' + (sel.length ? '' : ' disabled') + '>Отправить</button></div>';
  return h;
}
function sendExp() {
  var s = ui.send; if (!s || !s.sel.length) return;
  if (state.exp.length >= slotsCount()) { toast('Все слоты заняты'); return; }
  var ids = s.sel.filter(function (id) { return dragonById(id) && !isAway(id); });
  if (!ids.length) return;
  var L = LOCS[s.loc], t = Date.now();
  state.exp.push({ loc: s.loc, ids: ids, start: t, end: t + L.min * 60e3 });
  track('exp', 1); ui.send = null; closeModal(); ui.tab = 'exp';
  haptic('ok'); toast('Отряд отправился: ' + L.name); render(); dirty(); flushCloud();
}
function collectExp(i) {
  var e = state.exp[i]; if (!e || Date.now() < e.end) return;
  var L = LOCS[e.loc], ds = e.ids.map(dragonById).filter(Boolean), rw = expReward(e.loc, ds);
  state.gold += rw.gold;
  var notes = [];
  ds.forEach(function (d) {
    var res = addXP(d, rw.xp);
    if (res.evolved) notes.push(d.name + ' эволюционировал: ' + STAGES[stageOf(d.lvl)].toLowerCase());
    else if (res.leveled) notes.push(d.name + ' достиг ' + d.lvl + ' уровня');
  });
  var loot = [];
  if (Math.random() < L.egg[0]) { state.tickets.basic++; loot.push('билет на обычное яйцо'); }
  if (Math.random() < L.egg[1]) { state.tickets.premium++; loot.push('билет на редкое яйцо'); }
  state.exp.splice(i, 1);
  state.expDone++;
  if (state.visited.indexOf(e.loc) < 0) state.visited.push(e.loc);
  track('expret', 1);
  haptic('ok'); render();
  openModal('<h2>Отряд вернулся!</h2><div style="font-size:64px;margin:8px 0">' + L.ic + '</div>' +
    '<p>' + (ds[0] ? ds[0].name : 'Отряд') + ' ' + pick(FLAVOR) + '.</p>' +
    '<p><b>+' + fmt(rw.gold) + ' 🪙</b> и ' + rw.xp + ' опыта каждому дракону</p>' +
    (loot.length ? '<p class="newlook">Найдено: ' + loot.join(', ') + '</p>' : '') +
    (notes.length ? '<p>' + notes.join('<br>') + '</p>' : '') +
    '<button class="btn primary" data-a="close">Отлично</button>');
  dirty(); flushCloud();
}
function hatch() {
  var eg = state.egg;
  var d = newDragon(rollRarity(eg.type));
  var key = d.b + '-' + d.v, isNew = state.seen.indexOf(key) < 0;
  if (isNew) state.seen.push(key);
  state.dragons.push(d);
  if (!state.active) state.active = d.id;
  state.egg = null; ui.view = 'dragon'; track('hatch', 1);
  haptic('ok'); render(); showHatch(d, isNew); dirty(); flushCloud();
}
function buyEgg(t) {
  if (state.egg) return;
  var c = eggCost(t);
  if (state.gold < c) { toast('Не хватает золота: нужно ' + fmt(c)); return; }
  spend(c);
  state.egg = { type: t, start: Date.now(), dur: EGGS[t].time }; ui.view = 'egg';
  haptic('ok'); render(); dirty();
}
function feed() {
  var d = active(); if (!d) return;
  if (d.lvl >= MAXL) { toast('Дракон достиг максимального уровня'); return; }
  var c = feedCost(d);
  if (state.gold < c) { toast('Не хватает золота: нужно ' + c); return; }
  spend(c); state.fed++; track('feed', 1);
  var res = addXP(d, 30);
  haptic('ok'); render();
  var cr = $('#creature'); if (cr) squish(cr, 'happy');
  if (res.evolved) showEvolve(d); else if (res.leveled) toast('Уровень ' + d.lvl + '!');
  dirty();
}
function collect() {
  var amt = Math.floor(pending());
  if (amt < 1) { toast('Пока нечего собирать'); return; }
  state.gold += amt; state.lastCollect = Date.now(); track('collect', 1);
  haptic('ok'); toast('Собрано: +' + fmt(amt) + ' 🪙'); render(); dirty();
}
function claimDaily() {
  var info = loginInfo(); if (info.claimed) return;
  var chest = info.day === 7, amt = DAILY[info.day - 1];
  state.gold += amt;
  if (chest) state.tickets.premium++;
  state.login = { last: today(), streak: info.streak };
  haptic('ok'); closeModal();
  toast(chest ? 'Сундук: +1 500 🪙 и билет на редкое яйцо' : 'Награда: +' + fmt(amt) + ' 🪙');
  render(); dirty(); flushCloud();
}
function shareLink() {
  var uidv = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || '';
  var base = 'https://t.me/' + CONFIG.BOT_USERNAME + (CONFIG.APP_SHORT_NAME ? '/' + CONFIG.APP_SHORT_NAME : '');
  return base + '?startapp=ref_' + uidv;
}
function share() {
  if (!CONFIG.BOT_USERNAME) { toast('Сначала впиши BOT_USERNAME в коде игры'); return; }
  var url = 'https://t.me/share/url?url=' + encodeURIComponent(shareLink()) + '&text=' + encodeURIComponent('Вылупи своего дракона! Шанс найти мифического.');
  try { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); } catch (e) {}
  track('share', 1); render(); dirty();
}
function openDragon(id) {
  var d = state.dragons.filter(function (x) { return x.id === id; })[0]; if (!d) return;
  var R = RARITY[d.r], B = BREEDS[d.b], V = B.v[d.v], st = stageOf(d.lvl), isA = d.id === state.active;
  openModal('<div style="--rc:' + R.color + '"><span class="banner">' + R.name + '</span><div class="big">' + dragonSVG(d, st) + '</div><h2>' + d.name + '</h2>' +
    '<p>' + B.el + ' ' + B.name + ' дракон, окрас «' + V[0] + '»<br>Уровень ' + d.lvl + ', ' + STAGES[st].toLowerCase() + '</p>' +
    '<p>Сила в походе: ' + power(d) + '. Доход: +' + hourly(d) + ' в час.</p>' +
    (isAway(d.id) ? '<p><b>Сейчас в экспедиции</b></p><button class="btn" data-a="close">Закрыть</button>' : isA ? '<p><b>Главный дракон гнезда</b></p><button class="btn" data-a="close">Закрыть</button>' :
      '<div class="two"><button class="btn primary" data-a="main" data-id="' + d.id + '">Сделать главным</button><button class="btn ghost" data-a="release" data-id="' + d.id + '">Отпустить</button></div><button class="btn" data-a="close" style="margin-top:8px">Закрыть</button>') + '</div>');
}
function openRelease(id) {
  var d = state.dragons.filter(function (x) { return x.id === id; })[0]; if (!d) return;
  openModal('<h2>Отпустить ' + d.name + '?</h2><p>Дракон улетит навсегда, а ты получишь ' + fmt(releaseValue(d)) + ' 🪙. Окрас останется в альбоме.</p>' +
    '<div class="two"><button class="btn" data-a="close">Оставить</button><button class="btn primary" data-a="releaseok" data-id="' + d.id + '">Отпустить</button></div>');
}

document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest && e.target.closest('[data-tap]'); if (!el) return;
  e.preventDefault();
  if (el.dataset.tap === 'dragon') tapDragon(e, el); else tapEgg(e, el);
});
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-a]'); if (!el) return;
  var a = el.dataset.a;
  if (a === 'overlay') { if (e.target === el) closeModal(); return; }
  switch (a) {
    case 'close': closeModal(); break;
    case 'tab': ui.tab = el.dataset.v; render(); break;
    case 'view': ui.view = el.dataset.v; render(); break;
    case 'feed': feed(); break;
    case 'collect': collect(); break;
    case 'buyegg': buyEgg(el.dataset.v); break;
    case 'useticket': {
      var tt = el.dataset.v;
      if (state.tickets[tt] > 0 && !state.egg) { state.tickets[tt]--; state.egg = { type: tt, start: Date.now(), dur: EGGS[tt].time }; ui.view = 'egg'; haptic('ok'); render(); dirty(); }
      break; }
    case 'hatch': if (state.egg && eggProg() >= 1) hatch(); break;
    case 'sendnew': openSend(); break;
    case 'pickloc': ui.send = { loc: +el.dataset.v, sel: [] }; setSheet(partyHTML()); break;
    case 'pick': {
      if (!ui.send) break;
      var ix = ui.send.sel.indexOf(el.dataset.id);
      if (ix >= 0) ui.send.sel.splice(ix, 1);
      else if (ui.send.sel.length < 3) ui.send.sel.push(el.dataset.id);
      else toast('Максимум 3 дракона');
      setSheet(partyHTML()); break; }
    case 'sendgo': sendExp(); break;
    case 'collectexp': collectExp(+el.dataset.i); break;
    case 'claimdaily': claimDaily(); break;
    case 'claimq': {
      var q = state.quests.list[+el.dataset.i];
      if (q && q.p >= q.n && !q.c) { q.c = true; state.gold += q.r; haptic('ok'); toast('Награда: +' + q.r + ' 🪙'); render(); dirty(); }
      break; }
    case 'claimbonus':
      if (!state.quests.bonus && state.quests.list.every(function (q) { return q.c; })) { state.quests.bonus = true; state.gold += 300; haptic('ok'); toast('Бонус: +300 🪙'); render(); dirty(); }
      break;
    case 'claimach': {
      var ac = ACH.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (ac && achInfo(ac).can) { state.ach[ac.id] = 1; state.gold += ac.r; haptic('ok'); toast('Достижение: +' + fmt(ac.r) + ' 🪙'); render(); dirty(); }
      break; }
    case 'dragon': openDragon(el.dataset.id); break;
    case 'main': state.active = el.dataset.id; closeModal(); toast('Новый главный дракон'); render(); dirty(); break;
    case 'release': openRelease(el.dataset.id); break;
    case 'releaseok': {
      var id = el.dataset.id, d = state.dragons.filter(function (x) { return x.id === id; })[0];
      if (d && id !== state.active && !isAway(id)) { state.gold += releaseValue(d); state.dragons = state.dragons.filter(function (x) { return x.id !== id; }); toast('Дракон улетел'); }
      closeModal(); render(); dirty(); break; }
    case 'share': share(); break;
  }
});

/* ---------- Запуск ---------- */
function tick() {
  if (!state) return;
  if (refreshQuests()) { if (ui.tab === 'quests') render(); }
  var now = Date.now(), redraw = false;
  state.exp.forEach(function (e, i) {
    var left = e.end - now; if (left <= 0) return;
    var t = $('#expt' + i), b = $('#expb' + i);
    if (t) t.textContent = fmtTime(left);
    if (b) b.style.width = Math.min(100, (now - e.start) / (e.end - e.start) * 100) + '%';
  });
  if (finishedCount() !== ui.fin) redraw = true;
  if (state.egg) {
    var p = eggProg(), eb = $('#eggbar');
    if (eb) {
      eb.style.width = (p * 100) + '%';
      var et = $('#eggtxt'); if (et) et.textContent = 'Осталось ' + fmtTime(state.egg.start + state.egg.dur - now);
      var cs = crackStage(p);
      if (cs !== ui.crack) { ui.crack = cs; var w = $('#eggwrap'); if (w) w.innerHTML = eggSVG(state.egg.type, p); }
    }
    if (p >= 1 && !ui.eggReady && $('#eggwrap') && ui.tab === 'home') redraw = true;
  }
  if (redraw) render();
  var pe = $('#pendtxt'); if (pe) pe.textContent = '+' + fmt(Math.floor(pending())) + ' 🪙';
  var gEl = $('#gold'); if (gEl) gEl.textContent = fmt(state.gold);
  var b2 = badges();
  var dots = document.querySelectorAll('#tabs .dot'), keys = ['home', 'exp', 'dragons', 'quests', 'rewards'];
  for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('show', !!b2[keys[i]]);
}

function start(loaded) {
  state = normalize(loaded || defaults());
  var startParam = '';
  try { startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; } catch (e) {}
  var fresh = !loaded;
  if (fresh && startParam.indexOf('ref_') === 0 && !state.ref) {
    state.ref = true; state.gold += 500; state.tickets.premium += 1;
  }
  refreshQuests();
  render(); dirty();
  if (fresh && state.ref) setTimeout(function () { toast('Подарок от друга: 500 🪙 и билет на редкое яйцо'); }, 600);
  else if (!loginInfo().claimed) setTimeout(showDaily, 350);
  setInterval(tick, 1000);
  setInterval(flushCloud, 30000);
}
Store.init();
Store.load(start);
})();
</script>
</body>
</html>
