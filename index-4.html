<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Драконье гнездо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

:root{
  --night:#1b1740; --panel:#2a2560; --panel2:#352f75; --ink:#f2efff; --mute:#a9a3d6;
  --ember:#ff8a3d; --ember2:#ff6a3d; --gold:#ffcf4a; --mint:#6fe3c1; --danger:#ff6b81;
  --r0:#9fb0c3; --r1:#4aa8ff; --r2:#b872ff; --r3:#ffb52e; --r4:#ff5fb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1740}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{
  max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,#0000 52%),
    radial-gradient(1px 1px at 78% 10%,#fff8 50%,#0000 52%),
    radial-gradient(1.5px 1.5px at 60% 34%,#fffa 50%,#0000 52%),
    radial-gradient(1px 1px at 30% 46%,#fff7 50%,#0000 52%),
    radial-gradient(1px 1px at 90% 52%,#fff7 50%,#0000 52%),
    radial-gradient(1.5px 1.5px at 44% 8%,#fff8 50%,#0000 52%),
    linear-gradient(180deg,#2c2670 0%,#1b1740 55%,#14203f 100%);
}
#top{display:flex;gap:8px;padding:12px 14px 6px;align-items:center;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.09);font-weight:700;font-size:14px;white-space:nowrap}
.chip.gold{background:rgba(255,207,74,.16);color:var(--gold);font-size:16px;flex:1}
.chip.dim{opacity:.55}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(14,11,40,.86);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{position:relative;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
#tabs button .ic{font-size:22px;filter:grayscale(.6);transition:transform .15s}
#tabs button.on{color:var(--gold)}
#tabs button.on .ic{filter:none;transform:translateY(-2px) scale(1.12)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid #1b1740;display:none}
.dot.show{display:block}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.07);width:max-content;margin:4px auto 0}
.seg button{padding:7px 18px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--ink)}

.scene{position:relative;height:310px;display:flex;align-items:flex-end;justify-content:center;margin-top:2px}
.glow{position:absolute;bottom:26px;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 66%);opacity:.3}
.nest{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:310px;height:84px;pointer-events:none}
.creature{position:relative;z-index:1;width:250px;height:250px;margin-bottom:38px;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:idle 3.4s ease-in-out infinite;transform-origin:50% 90%}
.creature.egg{width:196px;height:236px;margin-bottom:34px}
.creature svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.creature.squish{animation:squish .2s ease-out}
.creature.wob{animation:wob .28s ease-out}
.creature.happy{animation:happy .6s ease-out}
.myth{animation:hue 6s linear infinite}
.tw{animation:tw 2.2s ease-in-out infinite}
.pop{position:absolute;z-index:5;font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #5a3a00,0 0 10px rgba(255,207,74,.6);pointer-events:none;animation:rise .85s ease-out forwards}

.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:14px 16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dname{font-size:22px;font-weight:800;line-height:1.15}
.sub{font-size:13px;color:var(--mute);line-height:1.35;margin-top:2px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;color:#1b1030;background:var(--rc,var(--r0));white-space:nowrap}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 6px}
.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#b8ff9f);transition:width .25s}
.bar.ember b{background:linear-gradient(90deg,var(--ember),var(--gold))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:rgba(0,0,0,.18);border-radius:14px;padding:9px 12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:17px;color:var(--gold)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:13px 14px;border-radius:16px;font-weight:800;font-size:15px;text-align:center;background:var(--panel2);color:var(--ink);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--ember),var(--ember2));color:#2b1300;box-shadow:0 4px 0 #a8431d}
.btn.primary:active{box-shadow:0 1px 0 #a8431d;transform:translateY(3px)}
.btn.mint{background:var(--mint);color:#06332a}
.btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.2)}
.btn.full{grid-column:1/-1;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.8;margin-top:1px}
.eggcap{text-align:center;margin-top:10px}
.eggcap .ename{font-size:20px;font-weight:800}
.eggcap .bar{max-width:280px;margin:10px auto 6px}
h3{font-size:18px;font-weight:800;margin:16px 2px 0}
.hint{font-size:13px;color:var(--mute);margin:6px 2px 0;line-height:1.4}

.shop{display:grid;gap:10px;margin-top:10px}
.shopitem{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(0,0,0,.2);border-radius:16px;padding:10px 12px;width:100%}
.shopitem .mini{width:52px;height:62px;flex:none}
.shopitem .mini svg{width:100%;height:100%}
.shopitem b{display:block;font-size:16px}
.shopitem span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.shopitem .cost{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dcard{position:relative;border-radius:20px;padding:8px 8px 12px;text-align:center;background:rgba(255,255,255,.06);border:2px solid var(--rc);box-shadow:0 0 18px -6px var(--rc),inset 0 0 24px -14px var(--rc)}
.dcard .art{width:100%;aspect-ratio:1/1}
.dcard .art svg{width:100%;height:100%;display:block}
.dcard b{display:block;font-size:15px}
.dcard span{font-size:12px;color:var(--mute)}
.dcard .star{position:absolute;top:8px;left:10px;font-size:16px}
.dcard .pill{position:absolute;top:8px;right:8px;font-size:11px;padding:3px 8px}
.album{display:grid;gap:8px;margin-top:10px}
.arow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:16px;padding:8px 12px}
.arow .el{font-size:22px;width:30px;text-align:center}
.arow .bn{flex:1;font-weight:700;font-size:14px}
.swatch{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.35);background:var(--sw)}
.swatch.no{background:rgba(255,255,255,.08);border-style:dashed;color:var(--mute)}

.q{display:flex;flex-direction:column;gap:6px}
.q .qt{font-weight:700;font-size:15px}
.q .qr{font-weight:800;color:var(--gold);white-space:nowrap}
.q .bar{margin:4px 0 0}
.q.done{opacity:.55}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border-radius:12px;padding:8px 0 6px;text-align:center;background:rgba(0,0,0,.2);font-size:11px;color:var(--mute);border:2px solid transparent}
.day i{display:block;font-style:normal;font-size:20px;margin:2px 0}
.day b{display:block;font-size:12px;color:var(--ink)}
.day.got{background:rgba(111,227,193,.16);border-color:rgba(111,227,193,.4)}
.day.now{background:rgba(255,207,74,.18);border-color:var(--gold);animation:glowpulse 1.8s ease-in-out infinite}
.ach .at{font-weight:800;font-size:15px}
.ach .ad{font-size:13px;color:var(--mute)}
.ach.got{opacity:.5}

.exp .party{display:flex;gap:6px;margin:10px 0 2px}
.exp .av{width:56px;height:56px;border-radius:14px;background:rgba(0,0,0,.22);padding:2px}
.exp .av svg{width:100%;height:100%;display:block}
.locrow{display:flex;gap:12px;align-items:center}
.lic{font-size:30px;width:44px;text-align:center;flex:none}
.pick{grid-template-columns:repeat(3,1fr);gap:8px}
.pick .dcard{padding:4px 4px 8px}
.pick .dcard b{font-size:13px}
.pick .pill{display:none}
.dcard.on{background:rgba(111,227,193,.22);outline:3px solid var(--mint)}
.sum{text-align:left;background:rgba(0,0,0,.22);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14px;line-height:1.55}
.sum b{color:var(--gold)}
.creature.egg.ready{animation:shake 1.5s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.78);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.sheet{position:relative;width:100%;max-width:380px;max-height:92vh;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#352f75,#2a2560);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:20px 18px 18px;text-align:center;animation:sheet .28s cubic-bezier(.2,1.3,.4,1)}
.sheet h2{font-size:24px;font-weight:800;margin-top:4px}
.sheet p{color:var(--mute);font-size:14px;line-height:1.4;margin-top:6px}
.sheet .big{width:230px;height:230px;margin:6px auto 0}
.sheet .big svg{width:100%;height:100%;display:block;overflow:visible}
.sheet .btn{width:100%;margin-top:14px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet .two .btn{margin-top:8px}
.banner{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;font-size:14px;color:#1b1030;background:var(--rc);box-shadow:0 0 24px var(--rc)}
.newlook{color:var(--mint)!important;font-weight:800}
.burst{position:absolute;left:50%;top:150px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;background:#efe6ff;clip-path:polygon(50% 0,100% 100%,0 80%);animation:fly .95s ease-out forwards}
.burst i:nth-child(3n){background:var(--rc)}
.burst i:nth-child(3n+1){background:#ffd98a}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0e0b28;color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;border:1px solid rgba(255,255,255,.15);max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.012,.99)}}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.09,.9)}100%{transform:scale(1)}}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes happy{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}80%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-80px) scale(1.15)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:scale(.85) translateY(20px);opacity:0}}
@keyframes fly{from{transform:translate(0,0) rotate(0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
@keyframes glowpulse{50%{box-shadow:0 0 16px rgba(255,207,74,.5)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---- v3 additions & overrides ---- */
#top{gap:6px;padding:10px 12px 6px}
.chip{padding:6px 10px;font-size:13px}
.chip.gold{font-size:15px;flex:1.2}
.chip.gem{color:#9fe8ff;background:rgba(80,200,255,.14)}
#screen{position:relative}
#screen.map{padding:0;overflow:hidden}
.scene{position:relative;height:320px;margin:6px 0 0;border-radius:26px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.scenesvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.glow{display:none}
.nest{display:none}
.creature{width:min(380px,104%);height:auto;aspect-ratio:372/316;margin-bottom:0;position:relative;z-index:2;animation:idle 3.4s ease-in-out infinite;transform-origin:50% 90%}
.creature.egg{width:180px;aspect-ratio:200/240;margin-bottom:26px}
.creature svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.dsvg{overflow:visible}
.btn.small{padding:8px 14px;font-size:14px}
.row.top{align-items:flex-start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.item{position:relative;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:18px;padding:6px 6px 10px;text-align:center}
.item.own{border-color:rgba(111,227,193,.55)}
.item.on{border-color:var(--gold);box-shadow:0 0 16px -4px var(--gold)}
.item .art{width:100%;height:0;padding-bottom:88%;border-radius:12px;overflow:hidden;position:relative;background:rgba(0,0,0,.2)}
.item .art>svg,.item .art>div{position:absolute;inset:0;width:100%;height:100%;display:block}
.item .art svg{width:100%;height:100%;display:block}
.item b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.item .pr{font-size:12px;color:var(--gold);font-weight:800;margin-top:3px;min-height:16px}
.item .pr.lock{color:var(--mute);font-weight:600}
.item .btn{padding:6px 8px;font-size:13px;margin-top:6px;width:100%}
.slotrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chipb{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:700;border:2px solid transparent}
.chipb.on{border-color:var(--mint);background:rgba(111,227,193,.2)}
.slotname{font-size:12px;color:var(--mute);margin-top:10px;text-align:left}

/* map */
.mapwrap{position:absolute;inset:0;touch-action:none;background:#0a2f6a;overflow:hidden}
.mapwrap svg#mapsvg{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapctl button{width:44px;height:44px;border-radius:14px;background:rgba(14,11,40,.78);border:1px solid rgba(255,255,255,.2);font-size:20px;font-weight:800;color:#fff}
.maphint{position:absolute;left:10px;top:10px;z-index:3;background:rgba(14,11,40,.72);padding:8px 12px;border-radius:14px;font-size:12px;color:var(--ink);max-width:62%;line-height:1.35;pointer-events:none}
.squads{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;overflow-x:auto;z-index:3;padding-bottom:2px}
.sq{flex:none;background:rgba(14,11,40,.86);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:8px 12px;font-weight:700;font-size:13px;text-align:left;min-width:140px}
.sq small{display:block;color:var(--mute);font-weight:600;font-size:12px;margin-top:2px}
.sq.done{border-color:var(--mint);background:rgba(20,70,60,.9);animation:glowpulse 1.8s infinite}
.mk text{font-family:inherit}

/* battle */
#battle{position:fixed;inset:0;z-index:60;display:none;background:#0e0b28}
#battle.show{display:block}
.bt{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
.bt .bgs{position:absolute;inset:0;opacity:.55}
.bt .bgs svg{width:100%;height:100%}
.bt>*:not(.bgs){position:relative;z-index:1}
.bt-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:15px;background:linear-gradient(180deg,rgba(10,8,30,.85),transparent)}
.bt-top small{font-weight:600;color:var(--mute);font-size:12px;display:block}
.bt-en{display:flex;gap:8px;justify-content:center;padding:6px 10px;min-height:150px;align-items:flex-end}
.en{flex:1;max-width:130px;text-align:center;border-radius:18px;padding:8px 4px 8px;background:rgba(10,8,30,.55);border:2px solid transparent;position:relative}
.en.sel{border-color:var(--gold);box-shadow:0 0 18px -4px var(--gold)}
.en.dead{opacity:.18;pointer-events:none;filter:grayscale(1)}
.en .em{font-size:50px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));display:block}
.en.boss .em{font-size:72px}
.en .nm{font-size:12px;font-weight:700;margin-top:2px}
.en .st{position:absolute;top:4px;right:6px;font-size:14px}
.hp{height:8px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:5px}
.hp b{display:block;height:100%;background:linear-gradient(90deg,#ff5a5a,#ffb02e);transition:width .25s}
.hp.ally b{background:linear-gradient(90deg,#3fbf6a,#b8ff9f)}
.bt-log{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:4px 18px;min-height:60px}
.bt-log div{font-size:14px;font-weight:700;text-shadow:0 2px 4px #000}
.bt-log div.old{opacity:.5;font-size:12px}
.bt-party{display:flex;gap:8px;justify-content:center;padding:6px 10px}
.pc{flex:1;max-width:140px;text-align:center;border-radius:18px;padding:4px 4px 8px;background:rgba(10,8,30,.6);border:2px solid transparent;position:relative}
.pc.act{border-color:var(--mint);box-shadow:0 0 18px -4px var(--mint)}
.pc.dead{opacity:.35;filter:grayscale(1)}
.pc .art{width:100%;aspect-ratio:372/316;pointer-events:none}
.pc .art svg{width:100%;height:100%;display:block}
.pc .nm{font-size:12px;font-weight:700}
.pc .cd{position:absolute;top:4px;left:6px;font-size:12px;font-weight:800;background:rgba(0,0,0,.55);border-radius:99px;padding:1px 6px}
.bt-act{padding:8px 12px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;background:linear-gradient(0deg,rgba(10,8,30,.92),transparent)}
.bt-act .btn{padding:12px 8px;font-size:14px}
.bt-act .info{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mute);min-height:16px}
.dmg{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-weight:900;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;animation:rise .9s ease-out forwards;z-index:5}
.dmg.heal{color:#8aff9f}.dmg.hit{color:#ffd24a}.dmg.crit{color:#ff8a5a}.dmg.me{color:#ff6b81}
.flash{animation:flash .35s}
@keyframes flash{50%{filter:brightness(2.2) saturate(1.5)}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@keyframes fxs{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(255,255,255,.14)}
.stars{color:#ffd24a;letter-spacing:1px;font-size:16px}
.diff-g{color:#6fe3a0}.diff-y{color:#ffd24a}.diff-r{color:#ff6b81}
.seg.wide{width:100%}.seg.wide button{flex:1;padding:8px 6px;font-size:13px}
.sheet .grid{max-height:44vh;overflow:auto}
#battle.show ~ #toast{bottom:auto;top:64px}

<body>
<div id="app">
  <header id="top"></header>
  <main id="screen"></main>
  <nav id="tabs"></nav>
</div>
<div id="battle"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
/* ===== Core data: breeds, rarities ===== */
const RARITY = [
  { name: 'Обычный',     color: '#9fb0c3', mult: 1 },
  { name: 'Редкий',      color: '#4aa8ff', mult: 1.6 },
  { name: 'Эпический',   color: '#b872ff', mult: 2.8 },
  { name: 'Легендарный', color: '#ffb52e', mult: 5 },
  { name: 'Мифический',  color: '#ff5fb0', mult: 10 }
];
// палитра: n имя, body, belly, wing (кости/тёмная часть), light (перепонка), eye, horn, accent, glow
const BREEDS = [
  { id:'fire',  name:'Огненный', el:'🔥', col:'#ff7a2a', v:[
    {n:'Алый',     body:'#d9381e', belly:'#ffc977', wing:'#a82414', light:'#ff9a3c', eye:'#ffd23c', horn:'#d8b274', accent:'#ff8a1f', glow:'#ff7a1a'},
    {n:'Янтарный', body:'#e58a1f', belly:'#ffe3a0', wing:'#b5560f', light:'#ffd06a', eye:'#fff06a', horn:'#e6c47a', accent:'#ffc94a', glow:'#ffb12e'},
    {n:'Магма',    body:'#3a2a2e', belly:'#8a4228', wing:'#4a1a1a', light:'#ff7a2f', eye:'#ff6a2a', horn:'#2a1b1b', accent:'#ff5a1a', glow:'#ff4a14'} ]},
  { id:'water', name:'Водный', el:'💧', col:'#3ab8ff', v:[
    {n:'Лазурный',  body:'#2f86d6', belly:'#d9f0ff', wing:'#1f5fae', light:'#8fe0ff', eye:'#ffe56a', horn:'#bfe6ff', accent:'#46e0e0', glow:'#3ab8ff'},
    {n:'Бирюзовый', body:'#1fb7a8', belly:'#e2fff6', wing:'#138a80', light:'#9ffff0', eye:'#fff29a', horn:'#c9fff3', accent:'#6cffd8', glow:'#2ee6c8'},
    {n:'Глубинный', body:'#26409a', belly:'#8fb4ff', wing:'#16286b', light:'#6fa8ff', eye:'#6ffcff', horn:'#9fbfff', accent:'#4a8cff', glow:'#2f6bff'} ]},
  { id:'nature', name:'Природный', el:'🌿', col:'#6fe04a', v:[
    {n:'Изумрудный', body:'#4aa832', belly:'#efe7b2', wing:'#2f7a22', light:'#b6f06a', eye:'#ffe55a', horn:'#9a6b3a', accent:'#ff9fc8', glow:'#7bff5a'},
    {n:'Мшистый',    body:'#7a8f35', belly:'#f0ecc0', wing:'#566a22', light:'#cfe27a', eye:'#ffd36b', horn:'#6b4a2a', accent:'#ffd86a', glow:'#b6d84a'},
    {n:'Осенний',    body:'#c27a24', belly:'#ffe9b0', wing:'#8a4f14', light:'#ffcf6a', eye:'#9aff8a', horn:'#7a4a24', accent:'#ff6a3a', glow:'#ffb040'} ]},
  { id:'light', name:'Светлый', el:'☀️', col:'#ffd54a', v:[
    {n:'Золотой',    body:'#e8b92a', belly:'#fff3c8', wing:'#c8921a', light:'#fff0a8', eye:'#ff9a2a', horn:'#f6d45a', accent:'#fff3b0', glow:'#ffe27a'},
    {n:'Жемчужный',  body:'#e2d4c4', belly:'#fff8f0', wing:'#c8b4b4', light:'#ffffff', eye:'#ff7aa8', horn:'#ffe6c2', accent:'#ffd0e8', glow:'#ffe8f4'},
    {n:'Рассветный', body:'#f09a7a', belly:'#ffe3cf', wing:'#d0704a', light:'#ffd9a8', eye:'#a85aff', horn:'#ffd2a0', accent:'#ffe28a', glow:'#ffb88a'} ]},
  { id:'shadow', name:'Теневой', el:'🌙', col:'#a14aff', v:[
    {n:'Ночной',     body:'#2a2238', belly:'#5a4380', wing:'#1a1426', light:'#7a3fe0', eye:'#c76bff', horn:'#15101f', accent:'#a14aff', glow:'#8a3dff'},
    {n:'Пепельный',  body:'#5f5f6f', belly:'#a9a9bb', wing:'#3a3a48', light:'#9a9ac0', eye:'#ff9d5c', horn:'#2f2f3a', accent:'#cfcfe8', glow:'#9a9ac0'},
    {n:'Сумеречный', body:'#5a2a6e', belly:'#c68be0', wing:'#3a1a4a', light:'#c070f0', eye:'#7fffd4', horn:'#2a143a', accent:'#ff5ac8', glow:'#c34aff'} ]},
  { id:'ice',   name:'Ледяной', el:'❄️', col:'#7fd6ff', v:[
    {n:'Ледяной',  body:'#b4d4f0', belly:'#f4fbff', wing:'#6aa0d8', light:'#dff3ff', eye:'#2f9dff', horn:'#8ad0ff', accent:'#4fc3ff', glow:'#7fd6ff'},
    {n:'Лунный',   body:'#b4aed8', belly:'#f1eefc', wing:'#7e76c0', light:'#e6e2ff', eye:'#b05aff', horn:'#c9c2ff', accent:'#d0b8ff', glow:'#c8c0ff'},
    {n:'Полярный', body:'#86d8da', belly:'#f2ffff', wing:'#4aaab4', light:'#d0ffff', eye:'#ff7ac8', horn:'#aaf0ff', accent:'#38e0ff', glow:'#7ff0ff'} ]}
];
const STAGES = ['Малыш', 'Подросток', 'Взрослый', 'Легенда'];

/* ===== Dragon renderer (SVG, side/3-4 view facing right) ===== */
let UID = 0;
const f1 = n => Math.round(n * 10) / 10;
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16, (n>>8)&255, n&255]; }
function rgb2hex(r,g,b){ const c=v=>Math.max(0,Math.min(255,Math.round(v))); return '#'+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1); }
function shade(hex, amt){ const [r,g,b]=hex2rgb(hex); return rgb2hex(r+amt,g+amt,b+amt); }
function mix(a, b, t){ const A=hex2rgb(a), B=hex2rgb(b); return rgb2hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }

function spline(pts, closed){
  const n = pts.length; let d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
  const get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    d += 'C' + f1(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f1(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
         f1(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f1(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
  }
  return closed ? d + 'Z' : d;
}
function sample(pts, per){
  const out = [], n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  out.push(pts[n - 1]); return out;
}
function nrm(a, b){ const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; }
// ribbon edges: returns {L:[...], R:[...], C:[...]} dense, with widths interpolated
function edges(pts, ws, per){
  const s = sample(pts, per || 6), m = s.length, L = [], R = [];
  for (let i = 0; i < m; i++) {
    const u = i / (m - 1) * (ws.length - 1), j = Math.min(ws.length - 2, Math.floor(u)), t = u - j;
    const w = (ws[j] * (1 - t) + ws[j + 1] * t) / 2;
    const nn = nrm(s[Math.max(0, i - 1)], s[Math.min(m - 1, i + 1)]);
    L.push([s[i][0] + nn[0] * w, s[i][1] + nn[1] * w, nn[0], nn[1], w]);
    R.push([s[i][0] - nn[0] * w, s[i][1] - nn[1] * w, -nn[0], -nn[1], w]);
  }
  return { C: s, L, R };
}
function ribbon(pts, ws, per, step){
  const e = edges(pts, ws, per), st = step || 3, a = [], b = [];
  for (let i = 0; i < e.L.length; i += st) { a.push(e.L[i]); b.push(e.R[i]); }
  const last = e.L.length - 1;
  if ((e.L.length - 1) % st) { a.push(e.L[last]); b.push(e.R[last]); }
  return spline(a.concat(b.reverse()), true);
}
// shifted ribbon (for belly plates / highlights): k in [-1..1] of half-width
function ribbonShift(pts, ws, k, ws2, per){
  const e = edges(pts, ws, per || 6), c = [];
  const side = k >= 0 ? e.L : e.R;
  for (let i = 0; i < e.C.length; i++) { const w = side[i][4] * Math.abs(k); c.push([e.C[i][0] + side[i][2] * w, e.C[i][1] + side[i][3] * w]); }
  const keys = []; for (let i = 0; i < c.length; i += 4) keys.push(c[i]); keys.push(c[c.length - 1]);
  return ribbon(keys, ws2, 5);
}
function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
function lerp(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
function poly(pts){ return 'M' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z'; }

/* stage parameters */
const SP = [
  { s: 0.80, hx: 0.80, hs: 1.62, neck: 0.50, wing: 0.46, horn: 0.55, tail: 0.58, eye: 1.6, spikes: 0, leg: 0.9 },
  { s: 0.90, hx: 0.9, hs: 1.34, neck: 0.78, wing: 0.74, horn: 0.82, tail: 0.82, eye: 1.28, spikes: 5, leg: 0.95 },
  { s: 1.00, hx: 1, hs: 1.12, neck: 1.00, wing: 1.00, horn: 1.00, tail: 1.00, eye: 1.0, spikes: 9, leg: 1 },
  { s: 1.04, hx: 1, hs: 1.18, neck: 1.06, wing: 1.2,  horn: 1.3,  tail: 1.12, eye: 1.0, spikes: 13, leg: 1 }
];
const VB = '-34 -8 372 316';

function wingShape(o, ctx){
  const k = o.k, sh = o.sh;
  const tr = p => [sh[0] + (p[0] - sh[0]) * k, sh[1] + (p[1] - sh[1]) * k];
  const el = tr(o.el), wr = tr(o.wr), tips = o.tips.map(tr), bk = tr(o.back);
  let d = 'M' + f1(sh[0]) + ' ' + f1(sh[1]) + 'L' + f1(el[0]) + ' ' + f1(el[1]) + 'L' + f1(wr[0]) + ' ' + f1(wr[1]) + 'L' + f1(tips[0][0]) + ' ' + f1(tips[0][1]);
  const chain = tips.concat([bk]);
  for (let i = 0; i < chain.length - 1; i++) {
    const a = chain[i], b = chain[i + 1], m = lerp(a, b, 0.5), c = lerp(m, wr, i === chain.length - 2 ? 0.22 : 0.3);
    d += 'Q' + f1(c[0]) + ' ' + f1(c[1]) + ' ' + f1(b[0]) + ' ' + f1(b[1]);
  }
  d += 'Z';
  let s = '<path d="' + d + '" fill="url(#' + ctx.id + o.grad + ')" stroke="' + ctx.wline + '" stroke-width="1.6" stroke-linejoin="round"/>';
  // folds
  let folds = '';
  for (let i = 0; i < chain.length - 1; i++) {
    const a = chain[i], b = chain[i + 1], m = lerp(a, b, 0.5), c = lerp(m, wr, 0.3);
    folds += 'M' + f1(wr[0]) + ' ' + f1(wr[1]) + 'Q' + f1(lerp(wr, c, 0.6)[0]) + ' ' + f1(lerp(wr, c, 0.6)[1]) + ' ' + f1(c[0]) + ' ' + f1(c[1]);
  }
  s += '<path d="' + folds + '" stroke="' + ctx.wline + '" stroke-width="1" fill="none" opacity=".22"/>';
  // bones
  const bone = ctx.bone;
  s += '<path d="' + ribbon([sh, el, wr], [13, 9, 6], 6) + '" fill="' + bone + '" stroke="' + ctx.wline + '" stroke-width="1.3"/>';
  tips.forEach((t, i) => {
    const m = lerp(wr, t, 0.5), bend = [m[0] + (wr[1] - t[1]) * 0.06, m[1] + (t[0] - wr[0]) * 0.06];
    s += '<path d="' + ribbon([wr, bend, t], [i === 0 ? 7 : 5, 3.5, 1.2], 6) + '" fill="' + bone + '" stroke="' + ctx.wline + '" stroke-width="1"/>';
  });
  // wrist claw
  const cl = [[wr[0] - 3, wr[1] - 1], [wr[0] + 5 * (o.dir || 1), wr[1] - 16 * k], [wr[0] + 5, wr[1] + 3]];
  s += '<path d="' + poly(cl) + '" fill="' + ctx.claw + '" stroke="' + ctx.wline + '" stroke-width="1"/>';
  return { svg: s, wr, tips, bk, el };
}

function dragonSVG(d, stage, opts){
  opts = opts || {};
  const B = BREEDS[d.b], V = B.v[d.v], R = RARITY[d.r], P = SP[stage];
  const id = 'd' + (++UID) + '_';
  const body = V.body, belly = V.belly, line = shade(body, -62), wline = shade(V.wing, -50);
  const translucent = (B.id === 'water' || B.id === 'ice' || B.id === 'shadow');
  const ctx = { id, wline, bone: mix(V.wing, body, 0.35), claw: shade(V.horn, -10) };
  let s = '<svg viewBox="' + VB + '" xmlns="http://www.w3.org/2000/svg" class="dsvg' + (d.r === 4 ? ' myth' : '') + '"><defs>' +
    '<linearGradient id="' + id + 'b" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="' + shade(body, 46) + '"/><stop offset=".5" stop-color="' + body + '"/><stop offset="1" stop-color="' + shade(body, -42) + '"/></linearGradient>' +
    '<linearGradient id="' + id + 'l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + belly + '"/><stop offset="1" stop-color="' + shade(belly, -34) + '"/></linearGradient>' +
    '<linearGradient id="' + id + 'w" x1="1" y1="0.8" x2="0" y2="0.1"><stop offset="0" stop-color="' + mix(V.wing, body, 0.4) + '" stop-opacity="' + (translucent ? .88 : 1) + '"/><stop offset=".55" stop-color="' + V.light + '" stop-opacity="' + (translucent ? .62 : .95) + '"/><stop offset="1" stop-color="' + shade(V.light, 24) + '" stop-opacity="' + (translucent ? .45 : .9) + '"/></linearGradient>' +
    '<linearGradient id="' + id + 'v" x1="0" y1="0.8" x2="1" y2="0.1"><stop offset="0" stop-color="' + mix(V.wing, body, 0.4) + '" stop-opacity="' + (translucent ? .88 : 1) + '"/><stop offset=".55" stop-color="' + shade(V.light, -22) + '" stop-opacity="' + (translucent ? .55 : .92) + '"/><stop offset="1" stop-color="' + V.light + '" stop-opacity="' + (translucent ? .4 : .85) + '"/></linearGradient>' +
    '<pattern id="' + id + 's" width="10" height="8" patternUnits="userSpaceOnUse"><path d="M0 8Q5 1 10 8M-5 4Q0-3 5 4M5 4Q10-3 15 4" stroke="' + line + '" stroke-width="1.1" fill="none" opacity=".5"/></pattern>' +
    '<radialGradient id="' + id + 'g"><stop offset="0" stop-color="' + V.glow + '" stop-opacity=".55"/><stop offset="1" stop-color="' + V.glow + '" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="' + id + 'r"><stop offset="0" stop-color="' + R.color + '" stop-opacity=".6"/><stop offset="1" stop-color="' + R.color + '" stop-opacity="0"/></radialGradient>' +
    '</defs>';

  /* --- aura & particles (outside stage transform) --- */
  s += '<circle cx="150" cy="150" r="' + (stage === 3 ? 170 : 140) + '" fill="url(#' + id + 'g)" opacity="' + (stage === 3 ? 1 : .55) + '"/>';
  if (d.r >= 2) s += '<circle cx="150" cy="150" r="' + (d.r >= 3 ? 165 : 140) + '" fill="url(#' + id + 'r)"/>';
  s += particles(B.id, V, stage, d.r);

  s += '<g transform="translate(150 272) scale(' + P.s + ') translate(-150 -272)">';

  /* --- geometry --- */
  const hip = [98, 226];
  const tailPts = [[98, 226], [74, 252], [102, 276], [158, 282], [216, 272], [250, 246], [254, 218]]
    .map(p => [hip[0] + (p[0] - hip[0]) * P.tail, 272 - (272 - p[1]) * (0.6 + 0.4 * P.tail)]);
  const tailW = [38, 34, 28, 21, 14, 8, 3.5];
  const neckBase = [158, 186];
  const neckAdult = [[158, 186], [178, 158], [178, 124], [190, 96], [212, 82]];
  const neck = neckAdult.map(p => [neckBase[0] + (p[0] - neckBase[0]) * P.neck, neckBase[1] + (p[1] - neckBase[1]) * P.neck]);
  const neckW = [54, 46, 38, 33, 30];
  const nEnd = neck[neck.length - 1];
  const head = [nEnd[0] + 9 * P.hs, nEnd[1] - 11 * P.hs];
  const bodyPts = [[180, 204], [168, 242], [132, 256], [98, 250], [76, 226], [80, 192], [112, 170], [148, 162], [174, 174]];

  /* wings */
  const wk = P.wing;
  const wingNear = { sh: [150, 168], el: [124, 118], wr: [104, 66], tips: [[40, 24], [24, 82], [36, 138], [76, 182]], back: [112, 204], k: wk, grad: 'w', dir: -1 };
  const wingFar = { sh: [166, 164], el: [186, 112], wr: [196, 66], tips: [[256, 22], [290, 66], [288, 118], [250, 170]], back: [190, 200], k: wk * 0.92, grad: 'v', dir: 1 };
  const wFar = wingShape(wingFar, ctx), wNear = wingShape(wingNear, ctx);
  s += '<g opacity=".95" filter="brightness(.9)">' + wFar.svg + '</g>';
  s += wNear.svg;
  s += wingExtras(B.id, V, [wNear, wFar], wk, translucent);

  /* tail */
  s += '<path d="' + ribbon(tailPts, tailW.map(w => w * (0.75 + 0.25 * P.tail)), 6) + '" fill="url(#' + id + 'b)" stroke="' + line + '" stroke-width="2"/>';
  s += '<path d="' + ribbon(tailPts, tailW.map(w => w * (0.75 + 0.25 * P.tail)), 6) + '" fill="url(#' + id + 's)" opacity=".55"/>';
  s += '<path d="' + ribbonShift(tailPts, tailW, -0.55, [10, 8, 6, 4, 2.4, 1]) + '" fill="url(#' + id + 'l)" opacity=".9"/>';
  s += tailTip(B.id, V, tailPts[tailPts.length - 1], P);

  /* body */
  const bodyD = spline(bodyPts, true);
  s += '<path d="' + bodyD + '" fill="url(#' + id + 'b)" stroke="' + line + '" stroke-width="2"/>';
  s += '<path d="' + bodyD + '" fill="url(#' + id + 's)" opacity=".5"/>';
  // hind leg
  const thigh = [[78, 202], [108, 196], [132, 214], [130, 242], [104, 254], [82, 238]];
  s += '<path d="' + spline(thigh, true) + '" fill="url(#' + id + 'b)" stroke="' + line + '" stroke-width="2"/>';
  s += '<path d="' + spline(thigh, true) + '" fill="url(#' + id + 's)" opacity=".55"/>';
  const foot = [[100, 260], [126, 256], [148, 266], [146, 275], [102, 276]];
  s += '<path d="' + spline(foot, true) + '" fill="' + shade(body, -8) + '" stroke="' + line + '" stroke-width="2"/>';
  s += claws([[138, 272], [146, 268], [150, 272]], V, 3, [[1, 0.6]]);

  /* spikes along back (behind neck) */
  s += spikesAlong(B.id, V, neck, neckW, tailPts, P, id);

  /* neck */
  const neckD = ribbon(neck, neckW.map(w => w * 0.98), 6);
  s += '<path d="' + neckD + '" fill="url(#' + id + 'b)" stroke="' + line + '" stroke-width="2"/>';
  s += '<path d="' + neckD + '" fill="url(#' + id + 's)" opacity=".5"/>';
  // belly plates (front of neck & chest)
  const bel = ribbonShift(neck, neckW, 0.58, [13, 11, 9, 8, 7]);
  s += '<path d="' + bel + '" fill="url(#' + id + 'l)" stroke="' + shade(belly, -60) + '" stroke-width="1" opacity=".96"/>';
  s += plates(neck, neckW, belly);
  // chest belly
  s += '<path d="' + spline([[170, 196], [176, 222], [160, 244], [140, 246], [150, 222]], true) + '" fill="url(#' + id + 'l)" stroke="' + shade(belly, -60) + '" stroke-width="1"/>';
  // rim light on neck / body
  s += '<path d="' + ribbonShift(neck, neckW, -0.78, [4, 3.5, 3, 2.5, 2]) + '" fill="#fff" opacity=".22"/>';
  s += '<path d="' + spline([[100, 190], [126, 174], [152, 168]], false) + '" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".18"/>';

const Store = {
  cloud: null, n: 0,
  init(){ try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) this.cloud = tg.CloudStorage; } catch (e) {} },
  readLocal(){ try { const t = window.localStorage.getItem('dragon_nest_v1'); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  writeLocal(str){ try { window.localStorage.setItem('dragon_nest_v1', str); } catch (e) {} },
  writeCloud(str){
    const c = this.cloud; if (!c) return;
    const parts = []; for (let i = 0; i < str.length; i += 3500) parts.push(str.slice(i, i + 3500));
    const prev = this.n || 0;
    parts.forEach((p, i) => c.setItem('g_' + i, p, () => {}));
    c.setItem('g_n', String(parts.length), () => {});
    if (prev > parts.length) { const rm = []; for (let j = parts.length; j < prev; j++) rm.push('g_' + j); try { c.removeItems(rm, () => {}); } catch (e) {} }
    this.n = parts.length;
  },
  load(cb){
    const self = this, local = this.readLocal(); let done = false;
    function finish(cs){ if (done) return; done = true; let s = local; if (cs && (!local || (cs.savedAt || 0) >= (local.savedAt || 0))) s = cs; cb(s); }
    if (!this.cloud) return finish(null);
    setTimeout(() => finish(null), 4000);
    try {
      this.cloud.getItem('g_n', (err, n) => {
        if (err || !n) return finish(null);
        const cnt = parseInt(n, 10); if (!cnt) return finish(null);
        self.n = cnt; const keys = []; for (let i = 0; i < cnt; i++) keys.push('g_' + i);
        self.cloud.getItems(keys, (err2, vals) => { if (err2 || !vals) return finish(null); try { finish(JSON.parse(keys.map(k => vals[k] || '').join(''))); } catch (e) { finish(null); } });
      });
    } catch (e) { finish(null); }
  }
};

/* ----- state ----- */
function defaults(){
  return {
    v: 3, gold: 0, gems: 5, spent: 0, fed: 0, savedAt: 0,
    dragons: [], active: null,
    egg: { type: 'basic', start: Date.now() - EGGS.basic.time, dur: EGGS.basic.time },
    tickets: { basic: 0, premium: 0 }, seen: [], lastCollect: Date.now(),
    login: { last: '', streak: 0 }, quests: { date: '', list: [], bonus: false },
    ach: {}, ref: false, exp: [], cleared: {}, wins: 0, bosses: 0, spells: 0, questsDone: 0,
    accs: [], bgs: ['nest'], bg: 'nest'
  };
}
function normalize(s){
  const d = defaults();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  if (s.v < 3) { s.exp = []; s.quests = { date: '', list: [], bonus: false }; s.gems = Math.max(s.gems, 5); s.v = 3; if (s.egg && s.egg.start === undefined) s.egg = d.egg; }
  if (s.tickets.basic === undefined) s.tickets.basic = 0;
  s.dragons.forEach(x => { if (!x.acc) x.acc = {}; });
  if (s.bgs.indexOf('nest') < 0) s.bgs.push('nest');
  return s;
}

/* ----- game helpers ----- */
function active(){ return dragonById(state.active); }
function dragonById(id){ for (let i = 0; i < state.dragons.length; i++) if (state.dragons[i].id === id) return state.dragons[i]; return null; }
function isAway(id){ return state.exp.some(e => e.ids.indexOf(id) >= 0); }
function stageOf(l){ return l >= 20 ? 3 : l >= 10 ? 2 : l >= 5 ? 1 : 0; }
function needXP(l){ return 40 + l * 20; }
function power(d){ return Math.round((10 + d.lvl * 4) * RARITY[d.r].mult); }
function hourly(d){ return Math.round(12 * (1 + (d.lvl - 1) * 0.3) * RARITY[d.r].mult); }
function totalHourly(){ return state.dragons.reduce((a, d) => a + hourly(d), 0); }
function pending(){ const ms = Math.min(Math.max(0, Date.now() - state.lastCollect), OFFLINE_CAP_H * 3600e3); return ms / 3600e3 * totalHourly(); }
function feedCost(d){ return 25 + d.lvl * 5; }
function eggCost(t){ return EGGS[t].base + EGGS[t].step * state.dragons.length; }
function releaseValue(d){ return Math.round(60 * RARITY[d.r].mult * (1 + d.lvl * 0.2)); }
function eggProg(){ const e = state.egg; return e ? Math.min(1, Math.max(0, (Date.now() - e.start) / e.dur)) : 0; }
function crackStage(p){ return p > 0.8 ? 3 : p > 0.55 ? 2 : p > 0.25 ? 1 : 0; }
function finishedCount(){ const n = Date.now(); return state.exp.filter(e => e.end <= n).length; }
function bestPartyPower(){ return state.dragons.filter(d => !isAway(d.id)).map(power).sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + b, 0); }
function track(k, n){ n = n || 1; state.quests.list.forEach(q => { if (q.k === k && !q.c) q.p = Math.min(q.n, q.p + n); }); }
function spend(n){ state.gold -= n; state.spent += n; track('spend', n); }
function refreshQuests(){
  const t = today();
  if (state.quests.date === t && state.quests.list.length) return false;
  const pool = QPOOL.filter(q => q.k !== 'win' && (q.k !== 'share' || CONFIG.BOT_USERNAME));
  state.quests = { date: t, bonus: false, list: [QPOOL[0]].concat(shuffle(pool).slice(0, 3)).map(q => ({ k: q.k, t: q.t, n: q.n, r: q.r, g: q.g, p: 0, c: false })) };
  return true;
}
function loginInfo(){
  const L = state.login, t = today();
  if (L.last === t) return { claimed: true, day: ((L.streak - 1) % 7) + 1, streak: L.streak };
  const ns = (L.last && dayNum(t) - dayNum(L.last) === 1) ? L.streak + 1 : 1;
  return { claimed: false, day: ((ns - 1) % 7) + 1, streak: ns };
}
function streakShown(){ const L = state.login; if (!L.last) return 0; return dayNum(today()) - dayNum(L.last) <= 1 ? L.streak : 0; }
function achInfo(a){ const r = a.f(state), cur = Math.min(r[0], r[1]); return { cur, tar: r[1], got: !!state.ach[a.id], can: !state.ach[a.id] && r[0] >= r[1] }; }
function badges(){
  const b = { home: false, map: false, dragons: false, shop: false, rewards: false };
  if (!loginInfo().claimed) b.rewards = true;
  ACH.forEach(a => { if (achInfo(a).can) b.rewards = true; });
  state.quests.list.forEach(q => { if (q.p >= q.n && !q.c) b.rewards = true; });
  if (state.quests.list.length && state.quests.list.every(q => q.c) && !state.quests.bonus) b.rewards = true;
  if (finishedCount() > 0) b.map = true;
  if (state.egg && eggProg() >= 1) b.home = true;

}
function rollRarity(type){ const o = EGGS[type].odds; let x = Math.random() * 100, acc = 0; for (let i = 0; i < o.length; i++) { acc += o[i]; if (x < acc) return i; } return 0; }
function newDragon(r){ return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), b: rnd(BREEDS.length), v: rnd(3), r, pat: rnd(3), horn: rnd(2), name: pick(NAMES), lvl: 1, xp: 0, acc: {} }; }
function addXP(d, n){ const before = stageOf(d.lvl); let lv = false; d.xp += n; while (d.lvl < MAXL && d.xp >= needXP(d.lvl)) { d.xp -= needXP(d.lvl); d.lvl++; lv = true; } if (d.lvl >= MAXL) d.xp = 0; return { leveled: lv, evolved: stageOf(d.lvl) > before }; }
function ownsAcc(id){ return state.accs.indexOf(id) >= 0; }
function ownsBg(id){ return state.bgs.indexOf(id) >= 0; }
function checkUnlocks(){

let MAP_BACK = '';
function diffClass(rec){ const p = bestPartyPower(); return p >= rec * 1.1 ? 'diff-g' : p >= rec * 0.7 ? 'diff-y' : 'diff-r'; }
function diffFor(rec, p){ return p >= rec * 1.1 ? 'легко' : p >= rec * 0.7 ? 'по силам' : 'опасно'; }

function mapHTML(){
  return '<div class="mapwrap" id="mapwrap"><svg id="mapsvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + MAP_BACK + '<g id="mapfx"></g>' + markersSVG() + '</svg>' +
    (ui.hintSeen ? '' : '<div class="maphint" id="maphint">Двигай карту пальцем, масштаб щипком. Нажми на остров. Звёзды показывают сложность.</div>') +

function mapView(){
  const wrap = $('#mapwrap'), svg = $('#mapsvg'); if (!wrap || !svg) return;
  const w = wrap.clientWidth || 360, h = wrap.clientHeight || 600, m = ui.map;
  const minZ = Math.min(w / MAP_W, h / MAP_H) * 1.02;
  m.z = Math.max(minZ, Math.min(1.8, m.z));
  const vw = w / m.z, vh = h / m.z;
  m.cx = Math.max(vw / 2 - 60, Math.min(MAP_W - vw / 2 + 60, m.cx)); m.cy = Math.max(vh / 2 - 60, Math.min(MAP_H - vh / 2 + 60, m.cy));
  if (vw > MAP_W) m.cx = MAP_W / 2; if (vh > MAP_H) m.cy = MAP_H / 2;
  svg.setAttribute('viewBox', f1(m.cx - vw / 2) + ' ' + f1(m.cy - vh / 2) + ' ' + f1(vw) + ' ' + f1(vh));
}
function initMap(){
  const wrap = $('#mapwrap'); if (!wrap) return;
  mapView(); mapFx();
  const ptrs = new Map(); let moved = 0, t0 = 0, pinch0 = 0, z0 = 1;
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    try { wrap.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { moved = 0; t0 = Date.now(); }
    if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); z0 = ui.map.z; }
  });
  wrap.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { if (!ui.hintSeen && moved > 30) { ui.hintSeen = true; const hh = $('#maphint'); if (hh) hh.remove(); } ui.map.cx -= dx / ui.map.z; ui.map.cy -= dy / ui.map.z; moved += Math.abs(dx) + Math.abs(dy); }
    else if (ptrs.size === 2) { const a = [...ptrs.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); if (pinch0 > 0) ui.map.z = z0 * d / pinch0; moved += 20; }
    mapView();
  });
  const up = e => {
    const had = ptrs.has(e.pointerId), single = ptrs.size === 1; ptrs.delete(e.pointerId);
    if (had && single && moved < 10 && Date.now() - t0 < 600) {
      const el = document.elementFromPoint(e.clientX, e.clientY), mk = el && el.closest ? el.closest('[data-loc]') : null;
      if (mk) openLoc(+mk.getAttribute('data-loc'));
    }
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  wrap.addEventListener('wheel', e => { e.preventDefault(); ui.map.z *= e.deltaY < 0 ? 1.12 : 0.89; mapView(); }, { passive: false });
}
function mapFx(){
  const g = $('#mapfx'); if (!g) return;

    const L = LOCS[e.loc], p = Math.min(1, Math.max(0, (now - e.start) / (e.end - e.start))), x = L.x + (NEST.x - L.x) * p, y = L.y + (NEST.y - L.y) * p;
    s += '<path d="M' + L.x + ' ' + L.y + 'L' + NEST.x + ' ' + NEST.y + '" stroke="#ffd24a" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round" opacity=".8"/>' +
      '<text id="fly' + i + '" x="' + f1(x) + '" y="' + f1(y + 12) + '" text-anchor="middle" font-size="40" style="filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))">🐉</text>';
  });

const aliveE = () => BT.enemies.filter(e => e.hp > 0);

function curTarget(){ let t = BT.enemies[BT.target]; if (!t || t.hp <= 0) { const i = BT.enemies.findIndex(e => e.hp > 0); BT.target = Math.max(0, i); t = BT.enemies[BT.target]; } return t; }

function hitDragon(p, dmg){ dmg = Math.max(1, Math.round(dmg)); p.hp = Math.max(0, p.hp - dmg); const i = BT.party.indexOf(p); fxNum('pc' + i, '-' + dmg, 'me', 'shake'); if (p.hp <= 0 && !p.dead) { p.dead = true; BT.faints++; blog(p.name + ' без сил!'); } return dmg; }

  fxNum('pc' + BT.party.indexOf(a), sp.ic, 'fxs', '');
  if (sp.kind === 'heal') {
    aliveP().forEach(p => { const h = Math.round(a.atk * sp.m); const before = p.hp; p.hp = Math.min(p.max, p.hp + h); fxNum('pc' + BT.party.indexOf(p), '+' + (p.hp - before), 'heal', ''); });
    blog(a.name + ': ' + sp.n + ', отряд исцелён');
  } else if (sp.kind === 'aoe') {
    aliveE().forEach(e => { const m = elemMult(a.b, e.b); hitEnemy(e, a.atk * sp.m * m * rnd2(), m > 1 ? 'crit' : 'hit'); if (sp.fx === 'weak') e.weak = 2; });
    blog(a.name + ': ' + sp.n + ' по всем врагам' + (sp.fx === 'weak' ? ', они ослаблены' : ''));
  } else {
    const m = elemMult(a.b, t.b), dmg = hitEnemy(t, a.atk * sp.m * m * rnd2(), m > 1 ? 'crit' : 'hit');
    if (sp.fx === 'burn') t.burn = 3, t.burnDmg = a.atk * 0.35;
    if (sp.fx === 'stun') t.stun = 1;
    if (sp.fx === 'drain') { const h = Math.round(dmg * 0.5), before = a.hp; a.hp = Math.min(a.max, a.hp + h); fxNum('pc' + BT.party.indexOf(a), '+' + (a.hp - before), 'heal', ''); }
    blog(a.name + ': ' + sp.n + ', ' + t.n + ' -' + dmg + (sp.fx === 'burn' ? ', горит' : sp.fx === 'stun' ? ', оглушён' : ''));

async function nextWave(){
  if (BT.wave >= BT.waves.length - 1) { BT.over = 'win'; finishBattle('win'); return false; }

}
async function enemyPhase(){
  const B0 = BT; blog('Ход врагов'); bRender(); await wait(400); if (BT !== B0) return;
  BT.enemies.forEach(e => { if (e.hp > 0 && e.burn > 0) { hitEnemy(e, e.burnDmg, 'hit'); e.burn--; } });
  if (!aliveE().length) return;
  for (const e of BT.enemies.slice()) {
    if (e.hp <= 0) continue;
    if (e.stun > 0) { e.stun--; blog(e.n + ' оглушён и пропускает ход'); bRender(); await wait(380); if (BT !== B0) return; continue; }
    const weak = e.weak > 0 ? 0.65 : 1;
    if (e.boss && BT.round % 3 === 0) {
      blog(e.n + ' использует мощный удар по всем!');
      aliveP().forEach(p => hitDragon(p, e.atk * 0.85 * weak * elemMult(e.b, p.b) * rnd2()));
    } else {
      const ps = aliveP(); if (!ps.length) break;
      const p = pick(ps), m = elemMult(e.b, p.b), dmg = hitDragon(p, e.atk * weak * m * rnd2());
      blog(e.n + ' бьёт ' + p.name + ' -' + dmg);

  }
}
function newRound(){

  BT.enemies.forEach(e => { if (e.weak > 0) e.weak--; });

async function bAct(kind, tIdx){

  if (it.ach) { const a = ACH.filter(x => x.id === it.ach)[0]; return '<div class="pr lock">Награда: «' + a.t + '»</div>'; }
  if (it.qd) return '<div class="pr lock">Заданий: ' + Math.min(state.questsDone, it.qd) + ' из ' + it.qd + '</div>';
  return '';
}
function canBuy(it){ return !!(it.gold || it.gems); }
function shopHTML(){
  let h = '<div class="seg wide"><button class="' + (ui.shop === 'acc' ? 'on' : '') + '" data-a="shoptab" data-v="acc">Аксессуары</button><button class="' + (ui.shop === 'bg' ? 'on' : '') + '" data-a="shoptab" data-v="bg">Фоны</button><button class="' + (ui.shop === 'egg' ? 'on' : '') + '" data-a="shoptab" data-v="egg">Яйца</button></div>';
  if (ui.shop === 'acc') {
    h += '<div class="hint">Аксессуары открываются за золото, кристаллы 💎 или награды за задания. Надевать их можно в карточке дракона.</div>';
    Object.keys(SLOTS).forEach(slot => {
      h += '<h3>' + SLOTS[slot] + '</h3><div class="grid3">';
      ACCS.filter(a => a.slot === slot).forEach(it => {
        const own = ownsAcc(it.id);
        const org = slot === 'neck' ? '60% 40%' : '70% 24%';
        h += '<div class="item' + (own ? ' own' : '') + '"><div class="art">' + sceneSVG('nest') + '<div style="position:absolute;inset:0;transform:scale(2.15);transform-origin:' + org + '">' + dragonSVG(previewDragon(slot, it.id), 2) + '</div></div><b>' + it.name + '</b>' + (own ? '<div class="pr lock">Куплено</div>' : priceTag(it)) + (!own && canBuy(it) ? '<button class="btn small primary" data-a="buyitem" data-k="acc" data-id="' + it.id + '">Купить</button>' : '') + '</div>';
      });
      h += '</div>';
    });
  } else if (ui.shop === 'bg') {
    h += '<div class="hint">Фон гнезда виден на главной странице. Некоторые фоны дают за достижения и задания.</div><div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr))">';
    BGS.forEach(it => {
      const own = ownsBg(it.id), cur = state.bg === it.id;
      h += '<div class="item' + (cur ? ' on' : own ? ' own' : '') + '"><div class="art" style="padding-bottom:75%">' + sceneSVG(it.id) + '</div><b>' + it.name + '</b>' + (own ? '<div class="pr lock">' + (cur ? 'Выбран' : 'Куплено') + '</div>' : priceTag(it)) +
        (own && !cur ? '<button class="btn small mint" data-a="selectbg" data-id="' + it.id + '">Выбрать</button>' : !own && canBuy(it) ? '<button class="btn small primary" data-a="buyitem" data-k="bg" data-id="' + it.id + '">Купить</button>' : '') + '</div>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><div class="dname" style="font-size:18px">Яйца драконов</div><div class="sub">Каждое яйцо хранит дракона неизвестной породы и редкости.</div>' + eggNote() + (state.egg ? '' : eggShopHTML()) + '</div>';
    if (state.egg) h += '<div class="card row"><div><b>В инкубаторе уже есть яйцо</b><div class="sub">Вылупи его в гнезде</div></div><button class="btn" data-a="tab" data-v="home">Гнездо</button></div>';
  }
  return h;
}
function buyItem(kind, id){
  const list = kind === 'acc' ? ACCS : BGS, it = list.filter(x => x.id === id)[0]; if (!it) return;
  if (kind === 'acc' ? ownsAcc(id) : ownsBg(id)) return;
  if (it.gold) { if (state.gold < it.gold) { toast('Не хватает золота: нужно ' + fmt(it.gold)); return; } spend(it.gold); }
  else if (it.gems) { if (state.gems < it.gems) { toast('Не хватает кристаллов: нужно ' + it.gems); return; } state.gems -= it.gems; }
  else return;
  if (kind === 'acc') {
    state.accs.push(id); const d = active();
    if (d && !d.acc[it.slot]) { d.acc[it.slot] = id; track('acc', 1); toast('Куплено и надето на ' + d.name); } else toast('Куплено: ' + it.name);
  } else { state.bgs.push(id); toast('Куплен фон: ' + it.name); }
  haptic('ok'); render(); dirty();
}

/* ===== Actions, ticking, start ===== */
function squish(el, cls){ cls = cls || 'squish'; el.classList.remove('squish', 'wob', 'happy'); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), cls === 'happy' ? 620 : 300); }
function pop(host, e, txt){ const r = host.getBoundingClientRect(), s = document.createElement('div'); s.className = 'pop'; s.textContent = txt; s.style.left = (e.clientX - r.left - 14 + (Math.random() * 30 - 15)) + 'px'; s.style.top = (e.clientY - r.top - 30) + 'px'; host.appendChild(s); setTimeout(() => s.remove(), 900); }
function hatch(){
  const eg = state.egg, d = newDragon(rollRarity(eg.type)), key = d.b + '-' + d.v, isNew = state.seen.indexOf(key) < 0;
  if (isNew) state.seen.push(key);
  state.dragons.push(d); if (!state.active) state.active = d.id;
  state.egg = null; ui.view = 'dragon'; track('hatch', 1);
  haptic('ok'); render(); showHatch(d, isNew); dirty(); flushCloud();
}
function showHatch(d, newLook){
  const R = RARITY[d.r], B = BREEDS[d.b], V = B.v[d.v]; let bits = '';
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + Math.random() * 0.4, dist = 110 + Math.random() * 90; bits += '<i style="--dx:' + Math.round(Math.cos(a) * dist) + 'px;--dy:' + Math.round(Math.sin(a) * dist) + 'px;--rot:' + rnd(360) + 'deg"></i>'; }
  openModal('<div style="--rc:' + R.color + '"><div class="burst">' + bits + '</div><span class="banner">' + R.name + '</span><div class="big" style="width:260px;height:221px">' + dragonSVG(d, 0) + '</div><h2>' + d.name + '</h2><p>' + B.el + ' ' + B.name + ' дракон, окрас «' + V.n + '»</p>' + (newLook ? '<p class="newlook">Новый окрас в альбоме!</p>' : '') + (d.r >= 3 ? '<p><b>Невероятная удача!</b> Такие драконы встречаются очень редко.</p>' : '') + '<button class="btn primary" data-a="close">Забрать</button></div>');
}
function buyEgg(t){
  if (state.egg) { toast('Сначала вылупи текущее яйцо'); return; }
  const c = eggCost(t); if (state.gold < c) { toast('Не хватает золота: нужно ' + fmt(c)); return; }
  spend(c); state.egg = { type: t, start: Date.now(), dur: EGGS[t].time }; ui.view = 'egg'; ui.tab = 'home'; haptic('ok'); render(); dirty();
}
function feed(){
  const d = active(); if (!d) return;
  if (d.lvl >= MAXL) { toast('Дракон достиг максимального уровня'); return; }
  const c = feedCost(d); if (state.gold < c) { toast('Не хватает золота: нужно ' + c); return; }
  spend(c); state.fed++; track('feed', 1);
  const res = addXP(d, 30); haptic('ok'); render(); const cr = $('#creature'); if (cr) squish(cr, 'happy');
  if (res.evolved) { openModal('<h2>Дракон вырос!</h2><div class="big" style="width:260px;height:221px">' + dragonSVG(d, stageOf(d.lvl)) + '</div><p>' + d.name + ' теперь: ' + STAGES[stageOf(d.lvl)].toLowerCase() + '. Он сильнее и красивее!</p><button class="btn primary" data-a="close">Отлично</button>'); }
  else if (res.leveled) toast('Уровень ' + d.lvl + '!');
  dirty();
}
function collectGold(){ const amt = Math.floor(pending()); if (amt < 1) { toast('Пока нечего собирать'); return; } state.gold += amt; state.lastCollect = Date.now(); track('collect', 1); haptic('ok'); toast('Собрано: +' + fmt(amt) + ' 🪙'); render(); dirty(); }
function showDaily(){
  const info = loginInfo(); if (info.claimed) return; const chest = info.day === 7;
  openModal('<h2>Награда за вход</h2><div style="font-size:90px;line-height:150px">' + (chest ? '🎁' : '🪙') + '</div><p>День ' + info.day + ' из 7. Серия: ' + info.streak + (info.streak > 1 ? ' дн. подряд' : ' день') + '.</p><p><b>' + (chest ? '1 500 золота, 10 💎 и билет на редкое яйцо' : fmt(DAILY[info.day - 1]) + ' золота' + (DAILY_GEMS[info.day - 1] ? ' и ' + DAILY_GEMS[info.day - 1] + ' 💎' : '')) + '</b></p><button class="btn primary" data-a="claimdaily">Получить</button>');
}
function claimDaily(){
  const info = loginInfo(); if (info.claimed) return; const chest = info.day === 7, amt = DAILY[info.day - 1];
  state.gold += amt; state.gems += DAILY_GEMS[info.day - 1]; if (chest) state.tickets.premium++;
  state.login = { last: today(), streak: info.streak }; haptic('ok'); closeModal(); toast(chest ? 'Сундук: 1 500 🪙, 10 💎 и билет' : 'Награда: +' + fmt(amt) + ' 🪙'); render(); dirty(); flushCloud();
}
function shareLink(){ const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || ''; return 'https://t.me/' + CONFIG.BOT_USERNAME + (CONFIG.APP_SHORT_NAME ? '/' + CONFIG.APP_SHORT_NAME : '') + '?startapp=ref_' + u; }
function share(){
  if (!CONFIG.BOT_USERNAME) { toast('Сначала впиши BOT_USERNAME в коде игры'); return; }
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(shareLink()) + '&text=' + encodeURIComponent('Вылупи своего дракона и отправляйся в бой! Шанс найти мифического.');
  try { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); } catch (e) {}
  track('share', 1); render(); dirty();
}
function releaseDragon(id){ const d = dragonById(id); if (d && id !== state.active && !isAway(id)) { state.gold += releaseValue(d); state.dragons = state.dragons.filter(x => x.id !== id); toast('Дракон улетел'); } closeModal(); render(); dirty(); }

document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('[data-tap]'); if (!el) return; e.preventDefault();
  if (el.dataset.tap === 'dragon') { if (active()) { squish(el); pop(el.parentElement, e, '❤️'); haptic('light'); } } else { squish(el, 'wob'); haptic('light'); }
});
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'overlay') { if (e.target === el) closeModal(); return; }
  switch (a) {
    case 'close': closeModal(); break;
    case 'tab': ui.tab = el.dataset.v; closeModal(); render(); break;
    case 'view': ui.view = el.dataset.v; render(); break;
    case 'rw': ui.rw = el.dataset.v; render(); break;
    case 'shoptab': ui.shop = el.dataset.v; render(); break;
    case 'feed': feed(); break;
    case 'collect': collectGold(); break;
    case 'hatch': if (state.egg && eggProg() >= 1) hatch(); break;
    case 'buyegg': buyEgg(el.dataset.v); break;
    case 'useticket': { const t = el.dataset.v; if (state.tickets[t] > 0 && !state.egg) { state.tickets[t]--; state.egg = { type: t, start: Date.now(), dur: EGGS[t].time }; ui.view = 'egg'; ui.tab = 'home'; haptic('ok'); render(); dirty(); } break; }
    case 'claimdaily': claimDaily(); break;
    case 'claimq': { const q = state.quests.list[+el.dataset.i]; if (q && q.p >= q.n && !q.c) { q.c = true; state.gold += q.r; state.gems += q.g || 0; state.questsDone++; haptic('ok'); toast('Награда: +' + q.r + ' 🪙' + (q.g ? ' +' + q.g + ' 💎' : '')); checkUnlocks(); render(); dirty(); } break; }
    case 'claimbonus': if (!state.quests.bonus && state.quests.list.every(q => q.c)) { state.quests.bonus = true; state.gold += 300; state.gems += 3; haptic('ok'); toast('Бонус: +300 🪙 +3 💎'); render(); dirty(); } break;
    case 'claimach': { const ac = ACH.filter(x => x.id === el.dataset.id)[0]; if (ac && achInfo(ac).can) { state.ach[ac.id] = 1; state.gold += ac.r; state.gems += ac.g || 0; haptic('ok'); toast('Достижение: +' + fmt(ac.r) + ' 🪙' + (ac.g ? ' +' + ac.g + ' 💎' : '')); checkUnlocks(); render(); dirty(); } break; }
    case 'share': share(); break;
    case 'dragon': openModal(dragonModalHTML(el.dataset.id)); break;
    case 'equip': { const d = dragonById(el.dataset.id); if (d) { const it = el.dataset.item; if (it) { d.acc[el.dataset.slot] = it; track('acc', 1); } else delete d.acc[el.dataset.slot]; haptic('light'); render(); setSheet(dragonModalHTML(d.id)); dirty(); } break; }
    case 'main': state.active = el.dataset.id; closeModal(); toast('Новый главный дракон'); render(); dirty(); break;
    case 'release': { const d = dragonById(el.dataset.id); if (d) openModal('<h2>Отпустить ' + d.name + '?</h2><p>Дракон улетит навсегда, а ты получишь ' + fmt(releaseValue(d)) + ' 🪙. Окрас останется в альбоме.</p><div class="two"><button class="btn" data-a="close">Оставить</button><button class="btn primary" data-a="releaseok" data-id="' + d.id + '">Отпустить</button></div>'); break; }
    case 'releaseok': releaseDragon(el.dataset.id); break;
    case 'buyitem': buyItem(el.dataset.k, el.dataset.id); break;
    case 'selectbg': state.bg = el.dataset.id; toast('Фон выбран'); render(); dirty(); break;
    /* map */
    case 'mapzoom': ui.map.z *= el.dataset.v === '1' ? 1.3 : 0.77; mapView(); break;
    case 'mapnest': ui.map.cx = NEST.x; ui.map.cy = NEST.y; mapView(); break;
    case 'loc': openLoc(+el.dataset.id); break;
    case 'pickparty': if (!state.dragons.some(d => !isAway(d.id))) { toast('Все драконы в пути, дождись возвращения'); break; } ui.send = { loc: +el.dataset.id, sel: [] }; setSheet(partyHTML()); break;
    case 'pick': { if (!ui.send) break; const ix = ui.send.sel.indexOf(el.dataset.id); if (ix >= 0) ui.send.sel.splice(ix, 1); else if (ui.send.sel.length < 3) ui.send.sel.push(el.dataset.id); else toast('Максимум 3 дракона'); setSheet(partyHTML()); break; }
    case 'startbattle': if (ui.send && ui.send.sel.length) { const ids = ui.send.sel.filter(id => dragonById(id) && !isAway(id)); if (ids.length) startBattle(ui.send.loc, ids); } break;
    case 'squad': squadModal(+el.dataset.i); break;
    case 'collectexp': closeModal(); collectExp(+el.dataset.i); break;
    case 'speedup': { const i = +el.dataset.i, ex = state.exp[i]; if (!ex) break; const cost = Math.max(1, Math.ceil((ex.end - Date.now()) / 600e3)); if (state.gems < cost) { toast('Не хватает кристаллов: нужно ' + cost); break; } state.gems -= cost; ex.end = Date.now(); render(); squadModal(i); dirty(); break; }
    /* battle */
    case 'target': if (BT && !BT.busy && !BT.over) { BT.target = +el.dataset.i; bRender(); } break;
    case 'bact': bAct(el.dataset.k); break;
    case 'bauto': if (BT) { BT.auto = !BT.auto; bRender(); if (BT.auto && !BT.busy) autoStep(); } break;
    case 'bretry': if (BT) { const id = BT.loc.id, ids = BT.ids; startBattle(id, ids); } break;
    case 'bretreat': if (BT) finishBattle('retreat'); break;
  }
});

function tick(){
  if (!state) return;
  if (refreshQuests() && ui.tab === 'rewards') render();
  const now = Date.now(); let redraw = false;
  if (finishedCount() !== ui.fin) redraw = true;
  if (ui.tab === 'map') mapTick();
  if (state.egg) {
    const p = eggProg(), eb = $('#eggbar');
    if (eb) { eb.style.width = (p * 100) + '%'; const et = $('#eggtxt'); if (et) et.textContent = 'Осталось ' + fmtTime(state.egg.start + state.egg.dur - now); const cs = crackStage(p); if (cs !== ui.crack) { ui.crack = cs; const w = $('#eggwrap'); if (w) w.innerHTML = eggSVG(state.egg.type, p); } }
    if (p >= 1 && !ui.eggReady && $('#eggwrap') && ui.tab === 'home') redraw = true;
  }
  if (redraw && !BT) { render(); if (ui.tab === 'map') mapFx(); }
  const pe = $('#pendtxt'); if (pe) pe.textContent = '+' + fmt(Math.floor(pending())) + ' 🪙';
  const g = $('#gold'); if (g) g.textContent = fmt(state.gold);
  const gm = $('#gems'); if (gm) gm.textContent = fmt(state.gems);
  const b = badges(), dots = document.querySelectorAll('#tabs .dot');
  for (let i = 0; i < dots.length; i++) dots[i].classList.toggle('show', !!b[TABS[i][0]]);
}
function start(loaded){
  state = normalize(loaded || defaults());
  let sp = ''; try { sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; } catch (e) {}
  const fresh = !loaded;
  if (fresh && sp.indexOf('ref_') === 0 && !state.ref) { state.ref = true; state.gold += 500; state.tickets.premium += 1; }
  refreshQuests(); MAP_BACK = mapBackdrop(); render(); dirty();
  if (fresh && state.ref) setTimeout(() => toast('Подарок от друга: 500 🪙 и билет на редкое яйцо'), 600);
  else if (!loginInfo().claimed) setTimeout(showDaily, 350);
  setInterval(tick, 1000); setInterval(flushCloud, 30000);
  window.addEventListener('resize', () => { if (ui.tab === 'map') mapView(); });
}
Store.init(); Store.load(start);

</script>
